                {

        let currentCategory = 'ancient';

        // タイムライン描画処理
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            const list = regimeDatabase[currentCategory];
            const searchQuery = document.getElementById('timeline-search').value.toLowerCase();

            // 検索・絞り込みの適用
            const filteredList = list.filter(item => {
                return (
                    item.year.toLowerCase().includes(searchQuery) ||
                    item.title.toLowerCase().includes(searchQuery) ||
                    item.regime.toLowerCase().includes(searchQuery) ||
                    item.summary.toLowerCase().includes(searchQuery)
                );
            });

            if (filteredList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-stone-400">
                        <p class="font-serif-jp text-lg font-bold">該当する年号・事件が見つかりません</p>
                        <p class="text-xs mt-1">検索キーワードを変えるか、他のカテゴリーに切り替えてみてください。</p>
                    </div>
                `;
                return;
            }

            filteredList.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `p-4 mb-3 bg-stone-50 border-2 border-stone-200 rounded-lg cursor-pointer transition-all duration-250 transform hover:-translate-y-0.5 hover:shadow hover:border-amber-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-3`;
                itemDiv.onclick = () => selectRegimeEvent(item);

                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <span class="font-mono text-sm font-bold bg-stone-200 text-stone-800 px-2.5 py-1 rounded text-center shrink-0 min-w-[75px]">
                            ${item.year}
                        </span>
                        <div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[9px] bg-stone-700 text-stone-200 px-2 py-0.5 rounded font-bold">${item.regime}</span>
                            </div>
                            <h4 class="font-serif-jp text-base font-bold tracking-tight text-stone-900 mt-1">${item.title}</h4>
                        </div>
                    </div>
                    <div class="text-xs text-stone-500 max-w-sm md:text-right font-medium">
                        ${item.summary.substring(0, 48)}...
                    </div>
                `;

                container.appendChild(itemDiv);
            });
        }

        // カテゴリー（時代）切り替え
        function switchCategory(category) {
            currentCategory = category;
            
            // タブのアクティブ化表示
            const categories = ['ancient', 'ritsuryo', 'kamakura', 'muromachi', 'edo', 'modern', 'contemporary'];
            categories.forEach(cat => {
                const tab = document.getElementById(`tab-${cat}`);
                if (cat === category) {
                    tab.className = "px-3 py-1.5 text-xs rounded font-bold bg-amber-700 text-white transition shadow-sm";
                } else {
                    tab.className = "px-3 py-1.5 text-xs rounded font-bold text-stone-300 hover:bg-stone-700 transition";
                }
            });

            document.getElementById('timeline-search').value = ''; // 検索クリア
            renderTimeline();
        }

        // 検索処理
        function searchTimeline() {
            renderTimeline();
        }

        // 出来事選択時の詳細パネル更新
        function selectRegimeEvent(item) {
            const detailPane = document.getElementById('detail-pane');

            // 💡 肉付け解説のHTML構築
            let meatHtml = item.meat.map(m => `
                <li class="flex items-start gap-2.5 bg-stone-850 p-3.5 rounded-lg border-l-4 border-amber-600 shadow-sm">
                    <span class="text-amber-500 font-bold shrink-0 text-base">◆</span>
                    <p class="text-stone-200 leading-relaxed text-xs font-medium">${m}</p>
                </li>
            `).join('');

            detailPane.innerHTML = `
                <div class="space-y-6 animate-fadeIn">
                    <!-- 年号と出来事タイトル -->
                    <div class="border-b border-stone-800 pb-4">
                        <div class="flex justify-between items-center gap-2 mb-2">
                            <span class="font-mono text-amber-500 text-lg font-bold">${item.year}</span>
                            <span class="text-[9px] bg-stone-800 border border-stone-700 text-stone-300 px-2.5 py-0.5 rounded font-bold">${item.regime}</span>
                        </div>
                        <h2 class="font-serif-jp text-lg md:text-xl font-bold text-stone-500 text-amber-100 tracking-tight leading-snug">${item.title}</h2>
                    </div>

                    <!-- 基本概要 -->
                    <div class="space-y-1.5">
                        <span class="text-[9px] tracking-wider text-stone-500 font-bold block uppercase">【基本概要】</span>
                        <p class="text-stone-300 text-xs leading-relaxed bg-stone-950 p-3.5 rounded-lg border border-stone-850">
                            ${item.summary}
                        </p>
                    </div>

                    <!-- 💡 徹底肉付け解説 -->
                    <div class="space-y-2.5">
                        <span class="text-[9px] tracking-wider text-amber-400 font-bold block uppercase">【因果関係 ＆ 記述・一問一答対策】</span>
                        <ul class="space-y-2.5">
                            ${meatHtml}
                        </ul>
                    </div>
                </div>
            `;

            // モバイル時の画面スクロール
            if (window.innerWidth < 1024) {
                detailPane.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 初期ロード
        window.onload = function() {
            renderTimeline();
        };
    </script>

    <!-- フェードインアニメーション用 -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</body>
