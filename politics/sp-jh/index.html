    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #0ea5e9; /* 専門科目用アクセントカラー（SkyBlue） */
            --bg-color: #f8fafc;
            --text-color: #334155;
            --sidebar-width: 200px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            overflow-x: hidden; /* ページ全体の横スクロールを完全に禁止 */
            width: 100%;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* --- サイドバー（継承） --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: white;
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-menu { padding: 6px 0; }
        .nav-category {
            padding: 8px 16px 2px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            color: #64748b;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .nav-item:hover { background-color: #f1f5f9; color: var(--accent-color); }
        .nav-item i { margin-right: 8px; width: 14px; height: 14px; }
        
        .nav-item.active {
            color: var(--accent-color);
            background-color: #e0f2fe;
            font-weight: bold;
            border-right: 3px solid var(--accent-color);
        }

        /* --- モバイル用トグルボタン --- */
        .mobile-toggle-btn {
            display: none;
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            color: var(--primary-color);
            align-items: center;
            justify-content: center;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 950;
            backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }

        /* --- メインコンテンツ --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            overflow-x: hidden; /* メイン領域のはみ出しによる横揺れを完全に防ぐ */
            width: 100%;
        }

        .page-header {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 24px;
        }

        .breadcrumb {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .breadcrumb a { color: #94a3b8; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 0;
            flex: 1;
        }

        /* --- フルオープン・目次スタイル --- */
        .chapter-details {
            background: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .chapter-summary {
            padding: 16px 20px;
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--primary-color);
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
        }

        .chapter-summary .icon-wrapper {
            margin-right: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
        }

        .chapter-content {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            background-color: white;
        }

        .lesson-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s;
            background-color: #ffffff;
        }

        .lesson-link:hover {
            border-color: var(--accent-color);
            background-color: #f0f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .lesson-num {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: bold;
            background: #e0f2fe;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .lesson-title {
            flex: 1;
            font-size: 0.85rem;
            line-height: 1.4;
            font-weight: 500;
        }

        .lesson-arrow {
            width: 16px;
            height: 16px;
            color: #cbd5e1;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .lesson-link:hover .lesson-arrow {
            color: var(--accent-color);
        }

        .lesson-link.disabled {
            opacity: 0.7;
            cursor: default;
            background-color: #f8fafc;
            border-style: dashed;
            border-color: #cbd5e1;
        }
        
        .lesson-link.disabled:hover {
            transform: none;
            box-shadow: none;
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .lesson-link.disabled .lesson-num {
            background: #e2e8f0;
            color: #94a3b8;
        }

        .lesson-link.disabled .lesson-title {
            color: #94a3b8;
        }

        /* --- カテゴリリンク --- */
        .category-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .category-card {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            gap: 16px;
        }

        .category-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(0,0,0,0.05);
        }

        .category-card .icon-box {
            color: var(--accent-color);
            width: 48px;
            height: 48px;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .category-card h3 {
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .category-card p {
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.4;
        }

        /* --- タブUIのスタイル --- */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: -2px;
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 演習テーブル用スタイル（マージ） --- */
        .section-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .table-container {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
        }

        .table-wrapper {
            overflow-x: auto; /* 表だけの横スクロールを有効化 */
            -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロールを有効化 */
            -ms-overflow-style: none;
            scrollbar-width: none;
            width: 100%;
        }
        .table-wrapper::-webkit-scrollbar {
            display: none;
        }
        
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px; /* デフォルトおよびPCでの最小幅を設定 */
            text-align: center;
            font-size: 0.85rem;
        }
        
        .custom-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: normal;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        
        .custom-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            color: #334155;
            vertical-align: middle;
        }
        
        .custom-table th:last-child,
        .custom-table td:last-child {
            border-right: none;
        }
        
        .custom-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .custom-table tbody tr:hover {
            background-color: #f8fafc;
            transition: background-color 0.2s ease;
        }
        
        .custom-table td.text-left {
            text-align: left;
            padding-left: 20px;
        }

        /* ステータスバッジ */
        .status-badge {
            display: inline-block;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .status-active { background-color: #a0c832; }
        .status-prep { background-color: #4bc0c8; }

        /* リンクスタイル */
        .content-link {
            color: #2563eb;
            text-decoration: underline;
            font-weight: bold;
            transition: color 0.2s;
        }
        .content-link:hover { color: #1d4ed8; }
        .content-link.disabled {
            color: #94a3b8;
            text-decoration: underline;
            cursor: not-allowed;
        }

        /* PDFボタン */
        .btn-pdf {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-pdf.active {
            background-color: #ef4444;
            color: white;
            border: 1px solid #dc2626;
        }
        .btn-pdf.active:hover {
            background-color: #b91c1c;
        }
        .btn-pdf.disabled {
            background-color: #f8fafc;
            color: #cbd5e1;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
        }

        /* アクションボタン */
        .btn-action {
            display: inline-block;
            border: 1px solid #94a3b8;
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-action:hover { 
            background-color: #e2e8f0; 
            color: #1e293b;
        }
        .btn-disabled {
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
        }
        .btn-disabled:hover {
            background-color: #f8fafc;
            color: #cbd5e1;
        }

        /* カスタムスクロールバー（PCでは非表示） */
        .custom-scrollbar-container {
            display: none;
        }

        footer {
            background-color: white;
            border-top: 1px solid #e2e8f0;
            padding: 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.7rem;
            margin-top: auto;
        }

        /* --- レスポンシブ対応 --- */
        @media (max-width: 1024px) {
            .category-links {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .mobile-toggle-btn { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            
            .main-content { 
                margin-left: 0; 
                width: 100%;
                overflow-x: hidden; /* コンテンツ全体の横ブレを防ぐ */
            }
            
            .page-header { padding-left: 60px; }
            
            .container { 
                padding: 16px; 
                width: 100%; 
                max-width: 100%; /* 横幅制限を厳密にし、はみ出しを防ぐ */
                box-sizing: border-box;
            }
            
            .chapter-content { grid-template-columns: 1fr; }
            .category-links { grid-template-columns: 1fr; }
            
            .section-box { 
                padding: 12px; 
                width: 100%;
                box-sizing: border-box;
            }

            .table-container {
                width: 100%;
                box-sizing: border-box;
            }

            .table-wrapper {
                width: 100%;
                overflow-x: auto; /* 表だけのスクロールを保証 */
                display: block;
            }
            
            .custom-table {
                min-width: 580px; /* スマートフォンで情報が潰れない適切な最小幅 */
                font-size: 0.75rem;
            }

            .custom-scrollbar-container {
                display: flex;
                align-items: center;
                background-color: #fdfdfd;
                border-top: 1px solid #e2e8f0;
                padding: 4px 12px;
                gap: 10px;
                width: 100%;
                box-sizing: border-box;
            }
            .scroll-btn {
                background: none;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .scroll-track {
                flex: 1;
                height: 8px;
                position: relative;
                background-color: #f1f5f9;
                border-radius: 10px;
            }
            .scroll-thumb {
                height: 100%;
                background-color: #888888; 
                border-radius: 10px;
                position: absolute;
                top: 0;
                left: 0;
                width: 30%;
            }

            /* 各列の幅比率を狭い画面向けに微調整 */
            .custom-table th:nth-child(1), .custom-table td:nth-child(1) { width: 45%; }
            .custom-table th:nth-child(2), .custom-table td:nth-child(2) { width: 12%; }
            .custom-table th:nth-child(3), .custom-table td:nth-child(3) { width: 18%; }
            .custom-table th:nth-child(4), .custom-table td:nth-child(4) { width: 15%; }
            .custom-table th:nth-child(5), .custom-table td:nth-child(5) { width: 10%; }
            
            .custom-table th, .custom-table td { padding: 10px 4px; }
            .custom-table td.text-left { padding-left: 8px; }
            .custom-table td:not(.text-left) { white-space: nowrap; }
            .status-badge { padding: 4px 6px; font-size: 0.65rem; }
            .btn-action { padding: 6px 8px; font-size: 0.65rem; }
        }
    </style>
</head>

            { chapter: "第5章 院政と武士の躍進", items: ["院政の始まり", "院政と平氏政権"] },
            { chapter: "第6章 武家政権の成立", items: ["鎌倉幕府の成立", "武士の社会", "モンゴル襲来と幕府の衰退", "鎌倉文化"] },
            { chapter: "第7章 武家社会の成長", items: ["室町幕府の成立", "幕府の衰退と庶民の台頭", "室町文化", "戦国大名の登場"] },
            { chapter: "第8章 近世の幕開け", items: ["織豊政権", "桃山文化"] },
            { chapter: "第9章 幕藩体制の成立と展開", items: ["幕藩体制の成立", "幕藩社会の構造", "幕政の安定", "経済の発展", "元禄文化"] },
            { chapter: "第10章 幕藩体制の動揺", items: ["幕政の改革", "宝暦・天明期の文化", "幕府の衰退と近代への道", "化政文化"] },
            { chapter: "第11章 近世から近代へ", items: ["開国と幕末の動乱", "幕府の滅亡と新政府の発足"] },
            { chapter: "第12章 近代国家の成立", items: ["明治維新と富国強兵", "立憲国家の成立"] },
            { chapter: "第13章 近代国家の展開", items: ["日清・日露戦争と国際関係", "第一次世界大戦と日本", "ワシントン体制"] },
            { chapter: "第14章 近代の産業と生活", items: ["近代産業の発展", "近代文化の発達", "市民生活の変容と大衆文化"] },
            { chapter: "第15章 恐慌と第二次世界大戦", items: ["恐慌の時代", "軍部の台頭", "第二次世界大戦"] },
            { chapter: "第16章 占領下の日本", items: ["占領と改革", "冷戦の開始と講和"] },
            { chapter: "第17章 高度成長の時代", items: ["55年体制", "経済復興から高度経済成長へ"] },
            { chapter: "第18章 激動する世界と日本", items: ["経済大国への道", "冷戦の終結と日本社会の変容"] }
        ];

        // --- 日本史向け演習データ ---
        const practiceData = [
            { id: 1, name: "地方政治の展開と武士", status: "active", link: "./test01/index.html", pdfStatus: "prep", pdfLink: "#", updatedAt: "2026/05/27" },
            { id: 2, name: "院政と平氏政権", status: "active", link: "./test02/index.html", pdfStatus: "prep", pdfLink: "#", updatedAt: "2026/05/27" },
            { id: 3, name: "鎌倉幕府の成立と武士の社会", status: "active", link: "./test03/index.html", pdfStatus: "prep", pdfLink: "#", updatedAt: "2026/05/27" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const containerAncient = document.getElementById('tab-ancient');
            const containerModern = document.getElementById('tab-modern');
            let globalCounter = 1;

            // 通史コンテンツの生成
            syllabusData.forEach((chapterData, index) => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter-details';

                const summary = document.createElement('div');
                summary.className = 'chapter-summary';
                summary.innerHTML = `
                    <div class="icon-wrapper"><i data-lucide="bookmark"></i></div>
                    ${chapterData.chapter}
                `;
                chapterDiv.appendChild(summary);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'chapter-content';

                chapterData.items.forEach((itemTitle) => {
                    const globalNumStr = String(globalCounter).padStart(3, '0');
                    const linkHref = `/n-kyozai/politics/sp-jh/jh${globalCounter}`;
                    const isPublished = publishedLessons.includes(globalCounter);
                    
                    const linkEl = document.createElement(isPublished ? 'a' : 'div');
                    if (isPublished) linkEl.href = linkHref;
                    
                    linkEl.className = 'lesson-link' + (isPublished ? '' : ' disabled');
                    
                    linkEl.innerHTML = `
                        <span class="lesson-num">${globalNumStr}</span>
                        <span class="lesson-title">${itemTitle}</span>
                        ${isPublished ? '<i data-lucide="chevron-right" class="lesson-arrow"></i>' : '<i data-lucide="lock" class="lesson-arrow" style="width:14px; height:14px; opacity: 0.5;"></i>'}
                    `;
                    
                    contentDiv.appendChild(linkEl);
                    globalCounter++;
                });

                chapterDiv.appendChild(contentDiv);

                if (index <= 10) {
                    containerAncient.appendChild(chapterDiv);
                } else {
                    containerModern.appendChild(chapterDiv);
                }
            });

            // 演習テーブルの描画
            renderPracticeTable();

            lucide.createIcons();

            // タブ切り替えロジック
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.target).classList.add('active');

                    // 演習タブが表示された時、スクロールバーの計算をやり直す
                    if (btn.dataset.target === 'tab-practice') {
                        setTimeout(updateScrollThumb, 50);
                    }
                });
            });
        });

        // 演習テーブルの生成関数
        function renderPracticeTable() {
            const tbody = document.getElementById('test-list-body');
            if (!tbody) return;
            tbody.innerHTML = ''; 

            practiceData.forEach(test => {
                const tr = document.createElement('tr');

                const isActive = test.status === "active";
                const statusLabel = isActive ? "テスト受付中" : "テスト準備中";
                const statusClass = isActive ? "status-active" : "status-prep";
                
                const isPdfActive = test.pdfStatus === "active";
                
                const linkHtml = isActive 
                    ? `<a href="${test.link}" class="content-link">${test.name}</a>` 
                    : `<span class="content-link disabled">${test.name}</span>`;

                const pdfBtnHtml = isPdfActive
                    ? `<a href="${test.pdfLink}" target="_blank" class="btn-pdf active" title="PDFを開く">PDF</a>`
                    : `<span class="btn-pdf disabled" title="PDF準備中">PDF</span>`;

                const btnHtml = isActive
                    ? `<a href="${test.link}" class="btn-action">テスト実施</a>`
                    : `<button disabled class="btn-action btn-disabled">テスト実施</button>`;

                tr.innerHTML = `
                    <td class="text-left">${linkHtml}</td>
                    <td>${pdfBtnHtml}</td>
                    <td>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </td>
                    <td style="color: #64748b;">${test.updatedAt}</td>
                    <td>${btnHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- カスタムスクロールバーの制御 ---
        const tableWrapper = document.getElementById('tableWrapper');
        const scrollThumb = document.getElementById('scrollThumb');
        const scrollTrack = document.getElementById('scrollTrack');
        const scrollLeftBtn = document.getElementById('scrollLeftBtn');
        const scrollRightBtn = document.getElementById('scrollRightBtn');

        function updateScrollThumb() {
            if (!tableWrapper || !scrollThumb || !scrollTrack) return;
            
            const wrapperWidth = tableWrapper.clientWidth;
            const scrollWidth = tableWrapper.scrollWidth;
            
            if (scrollWidth <= wrapperWidth || wrapperWidth === 0) {
                scrollThumb.style.width = '100%';
                scrollThumb.style.left = '0px';
                return;
            }
            
            const trackWidth = scrollTrack.clientWidth;
            const thumbWidth = (wrapperWidth / scrollWidth) * trackWidth;
            scrollThumb.style.width = `${Math.max(thumbWidth, 30)}px`;
            
            const scrollLeft = tableWrapper.scrollLeft;
            const maxScrollLeft = scrollWidth - wrapperWidth;
            const maxThumbLeft = trackWidth - parseFloat(scrollThumb.style.width);
            
            const thumbLeft = (scrollLeft / maxScrollLeft) * maxThumbLeft;
            scrollThumb.style.left = `${thumbLeft}px`;
        }

        if (tableWrapper) {
            tableWrapper.addEventListener('scroll', updateScrollThumb);
            window.addEventListener('resize', updateScrollThumb);
        }

        if (scrollLeftBtn) {
            scrollLeftBtn.addEventListener('click', () => {
                tableWrapper.scrollBy({ left: -150, behavior: 'smooth' });
            });
        }

        if (scrollRightBtn) {
            scrollRightBtn.addEventListener('click', () => {
                tableWrapper.scrollBy({ left: 150, behavior: 'smooth' });
            });
        }

        // サイドバー制御
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        const toggleSidebar = () => {
            const isActive = sidebar.classList.contains('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            menuToggle.innerHTML = isActive ? '<i data-lucide="menu"></i>' : '<i data-lucide="x"></i>';
            lucide.createIcons();
            document.body.style.overflow = isActive ? '' : 'hidden';
        };

        if(menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if(overlay) overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
