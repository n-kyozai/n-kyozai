<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教員採用試験対策：学校教育法・施行令・施行規則クイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-scale: 1;
        }
        html {
            font-size: calc(16px * var(--font-scale));
        }

        .header-bg { background-color: #0f766e; } /* ディープティール */
        
        .timer-box {
            font-variant-numeric: tabular-nums;
        }

        .blank-input {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .blank-input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.2);
        }

        .blank-select {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 32px 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            transition: border-color 0.2s;
        }
        .blank-select:focus {
            border-color: #0f766e;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .fs-base { font-size: calc(1rem * var(--font-scale)) !important; line-height: calc(1.5rem * var(--font-scale)) !important; }
        .fs-lg { font-size: calc(1.125rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-xl { font-size: calc(1.25rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-2xl { font-size: calc(1.5rem * var(--font-scale)) !important; line-height: calc(2rem * var(--font-scale)) !important; }
        .fs-sm { font-size: calc(0.875rem * var(--font-scale)) !important; line-height: calc(1.25rem * var(--font-scale)) !important; }

        .result-screen-font {
            font-size: calc(0.875rem * var(--font-scale)) !important;
            line-height: calc(1.35rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-title {
            font-size: calc(1.25rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-score {
            font-size: calc(2.5rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-lbl {
            font-size: calc(1rem * var(--font-scale)) !important;
        }
        .result-screen-font .fs-lg {
            font-size: calc(0.95rem * var(--font-scale)) !important;
            line-height: calc(1.4rem * var(--font-scale)) !important;
        }
        .result-screen-font .fs-sm {
            font-size: calc(0.8rem * var(--font-scale)) !important;
            line-height: calc(1.15rem * var(--font-scale)) !important;
        }
        .result-screen-font h4 {
            font-size: calc(0.95rem * var(--font-scale)) !important;
        }
    </style>
</head>
<body class="bg-[#f1f5f9] text-gray-800 font-sans min-h-screen flex flex-col fs-base transition-none">

            <div class="flex-1 w-full flex flex-col">
                
                <div class="bg-[#e2e8f0] p-2 md:p-3 rounded-lg border border-gray-300 mb-4 flex justify-between items-center shadow-sm">

                        <button id="menu-btn" class="md:hidden p-1.5 rounded bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 transition" aria-label="メニューを開く">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />

                    </div>
                    
                    <div class="flex items-center gap-2 sm:gap-3">
                        <button id="font-size-btn" class="border border-gray-400 bg-white rounded px-2 py-1 flex items-center justify-center font-bold text-gray-700 shadow-sm hover:bg-gray-100 focus:outline-none transition" style="font-size: 14px; line-height: 1.2;">

                </div>

                <div class="flex justify-between items-center mt-2">

    </main>

    <script>
        const baseQuestions = [
            // ==========================================
            // PART 1: 学校教育法（法律本文 - 重点出題）
            // ==========================================
            { title: "学校教育法 第1条（学校の定義）", text: "この法律で、学校とは、幼稚園、小学校、中学校、[HOLE]、高等学校、中等教育学校、特別支援学校、大学及び高等専門学校とする。", correctAnswer: "義務教育学校" },
            { title: "学校教育法 第2条第1項（学校設置者）", text: "学校は、国...地方公共団体...及び私立学校法第三条に規定する[HOLE]のみが、これを設置することができる。", correctAnswer: "学校法人" },
            { title: "学校教育法 第6条（授業料）", text: "学校においては、授業料を徴収することができる。ただし、国立又は公立の小学校及び中学校、義務教育学校、中等教育学校の前期課程又は特別支援学校の小学部及び中学部における[HOLE]については、これを徴収することができない。", correctAnswer: "義務教育" },
            { title: "学校教育法 第7条（校長及び教員の設置）", text: "学校には、[HOLE]及び相当数の教員を置かなければならない。", correctAnswer: "校長" },
            { title: "学校教育法 第11条（懲戒及び体罰禁止）", text: "校長及び教員は、教育上必要があると認めるときは、文部科学大臣の定めるところにより、児童、生徒及び学生に懲戒を加えることができる。ただし、[HOLE]を加えることはできない。", correctAnswer: "体罰" },
            { title: "学校教育法 第12条（健康診断）", text: "学校においては、別に法律で定めるところにより、幼児、児童、生徒及び学生並びに職員の健康の保持増進を図るため、[HOLE]を行い、その他その保健に必要な措置を講じなければならない。", correctAnswer: "健康診断" },
            { title: "学校教育法 第16条（普通教育を受けさせる義務）", text: "保護者は、次条に定めるところにより、子に[HOLE]年の普通教育を受けさせる義務を負う。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 九）</span>", correctAnswer: "九", options: ["六", "九", "十二", "十五"] },
            { title: "学校教育法 第17条第1項（就学義務の始期）", text: "保護者は、子の満[HOLE]歳に達した日の翌日以後における最初の学年の初めから...就学させる義務を負う。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 六）</span>", correctAnswer: "六", options: ["五", "六", "七", "八"] },
            { title: "学校教育法 第17条第2項（中学校等の就学義務）", text: "保護者は、子が小学校の課程...を修了した日の翌日以後における最初の学年の初めから、満[HOLE]歳に達した日の属する学年の終わりまで、これを中学校...に就学させる義務を負う。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 十五）</span>", correctAnswer: "十五", options: ["十二", "十四", "十五", "十八"] },
            { title: "学校教育法 第18条（就学の猶予又は免除）", text: "病弱、発育不完全その他やむを得ない事由のため、就学困難と認められる者の保護者に対しては、[HOLE]の教育委員会は、文部科学大臣の定めるところにより...義務を猶予又は免除することができる。", correctAnswer: "市町村" },
            { title: "学校教育法 第19条（就学援助）", text: "[HOLE]的理由によつて、就学困難と認められる学齢児童又は学齢生徒の保護者に対しては、市町村は、必要な援助を与えなければならない。", correctAnswer: "経済" },
            { title: "学校教育法 第20条（就学の保障）", text: "学齢児童又は学齢生徒を使用する者は、その使用によつて、当該学齢児童又は学齢生徒が、[HOLE]教育を受けることを妨げてはならない。", correctAnswer: "義務" },
            { title: "学校教育法 第37条第4項（校長の職務）", text: "校長は、校務をつかさどり、所属職員を[HOLE]する。", correctAnswer: "監督" },
            { title: "学校教育法 第37条第5項（副校長の職務）", text: "副校長は、校長を助け、命を受けて[HOLE]をつかさどる。", correctAnswer: "校務" },
            { title: "学校教育法 第37条第7項（教頭の職務）", text: "教頭は、校長（副校長を置く学校にあつては、校長及び副校長）を助け、校務を[HOLE]し、及び必要に応じ児童・生徒の教育をつかさどる。", correctAnswer: "整理" },
            { title: "学校教育法 第37条第9項（主幹教諭の職務）", text: "主幹教諭は、校長...及び教頭を助け、命を受けて校務の一部を整理し、並びに児童・生徒の[HOLE]をつかさどる。", correctAnswer: "教育" },
            { title: "学校教育法 第37条第10項（指導教諭の職務）", text: "指導教諭は、児童・生徒の教育をつかさどり、並びに教諭その他の職員に対して、教育指導の改善及び充実のために必要な[HOLE]及び助言を行う。", correctAnswer: "指導" },
            { title: "学校教育法 第37条第15項（事務職員の職務）", text: "事務職員は、[HOLE]をつかさどる。", correctAnswer: "事務" },
            { title: "学校教育法 第42条第1項（学校評価）", text: "学校は、文部科学大臣の定めるところにより当該学校の教育活動その他の学校運営の状況について評価を行い...その[HOLE]の向上に努めなければならない。", correctAnswer: "教育水準" },
            { title: "学校教育法 第43条（情報提供）", text: "学校は、当該学校に関する保護者及び地域住民その他の関係者の理解を深めるとともに...学校運営の状況に関する情報を[HOLE]に提供するものとする。", correctAnswer: "積極的" },
            { title: "学校教育法 第45条（中学校の目的）", text: "中学校は、小学校における教育の基礎の上に、心身の発達に応じて、義務教育として行われる[HOLE]教育を施すことを目的とする。", correctAnswer: "普通" },
            { title: "学校教育法 第47条（中学校の修業年限）", text: "中学校の修業年限は、[HOLE]年とする。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 三）</span>", correctAnswer: "三", options: ["二", "三", "四", "六"] },
            { title: "学校教育法 第49条の二・四（義務教育学校の修業年限・区分）", text: "義務教育学校の修業年限は、九年とする。義務教育学校の課程は、これを前期[HOLE]年の前期課程及び後期三年の後期課程に区分する。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 六）</span>", correctAnswer: "六", options: ["三", "四", "五", "六"] },

            { title: "学校教育法 第56条（高等学校の修業年限）", text: "高等学校の修業年限は、全日制の課程については、三年とし、定時制の課程及び通信制の課程については、[HOLE]年以上とする。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 三）</span>", correctAnswer: "三", options: ["二", "三", "四", "五"] },
            { title: "学校教育法 第66条（中等教育学校の区分）", text: "中等教育学校の課程は、これを前期三年の前期課程及び後期[HOLE]年の後期課程に区分する。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 三）</span>", correctAnswer: "三", options: ["二", "三", "四", "五"] },
            { title: "学校教育法 第72条（特別支援学校の目的）", text: "特別支援学校は...幼稚園、小学校、中学校又は高等学校に準ずる教育を施すとともに、障害による学習上又は生活上の困難を克服し[HOLE]を図るために必要な知識技能を授けることを目的とする。", correctAnswer: "自立" },
            { title: "学校教育法 第76条第1項（特別支援学校の学部）", text: "特別支援学校には、[HOLE]部及び中学部を置かなければならない。ただし、特別の必要のある場合においては、そのいずれかのみを置くことができる。", correctAnswer: "小学" },

            { title: "学校教育法施行令 第8条（指定の変更）", text: "市町村の教育委員会は...相当と認めるときは、[HOLE]の申立てにより、その指定した学校を変更することができる。", correctAnswer: "保護者" },
            { title: "学校教育法施行令 第20条（出席状況不良の通知）", text: "校長は、当該学校に在学する学齢児童又は学齢生徒が、休業日を除き引き続き[HOLE]日間出席せず...正当な事由がないと認められるときは、速やかに、その旨を市町村の教育委員会に通知しなければならない。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 七）</span>", correctAnswer: "七", options: ["五", "七", "十", "十四"] },
            { title: "学校教育法施行令 第21条（教育委員会の行う出席の督促）", text: "市町村の教育委員会は、第二十条の通知を受けたとき...保護者が義務を怠つていると認められるときは、その保護者に対して、当該学齢児童又は学齢生徒の[HOLE]を督促しなければならない。", correctAnswer: "出席" },
            { title: "学校教育法施行令 第22条の三（視覚障害者の障害程度）", text: "両眼の視力がおおむね[HOLE]未満のもの又は視力以外の視機能障害が高度のもののうち...<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※アラビア数字で解答（例: 0.3）</span>", correctAnswer: "0.3", options: ["0.1", "0.2", "0.3", "0.5"] },
            { title: "学校教育法施行令 第22条の三（聴覚障害者の障害程度）", text: "両耳の聴力レベルがおおむね[HOLE]デシベル以上のもののうち...<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 六〇）</span>", correctAnswer: "六〇", options: ["四〇", "五〇", "六〇", "七〇"] },
            { title: "学校教育法施行令 第29条第1項（学期及び休業日）", text: "公立の学校（大学を除く。）の学期並びに休業日は、市町村又は都道府県の設置する学校にあつては当該市町村又は都道府県の[HOLE]が定める。", correctAnswer: "教育委員会" },

            // ==========================================

            { title: "学校教育法施行規則 第20条第1項（校長の資格）", text: "校長の資格は...教諭の専修免許状又は一種免許状を有し、かつ、教育に関する職に[HOLE]年以上あつたこと等とされる。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 五）</span>", correctAnswer: "五", options: ["三", "五", "十", "十五"] },
            { title: "学校教育法施行規則 第24条第1項（指導要録）", text: "校長は、その学校に在学する児童等の[HOLE]（学校教育法施行令第三十一条に規定する児童等の学習及び健康の状況を記録した書類の原本をいう。）を作成しなければならない。", correctAnswer: "指導要録" },
            { title: "学校教育法施行規則 第26条第2項（懲戒の処分者）", text: "懲戒のうち、退学、停学及び訓告の処分は、[HOLE]が行う。", correctAnswer: "校長" },
            { title: "学校教育法施行規則 第26条第4項（停学の禁止）", text: "第二項の停学は、[HOLE]児童又は学齢生徒に対しては、行うことができない。", correctAnswer: "学齢" },
            { title: "学校教育法施行規則 第28条第2項（表簿の保存期間）", text: "学校において備えなければならない表簿は、別に定めるもののほか、[HOLE]年間保存しなければならない。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 五）</span>", correctAnswer: "五", options: ["三", "五", "十", "二十"] },
            { title: "学校教育法施行規則 第28条第2項ただし書（学籍記録の保存期間）", text: "ただし、指導要録及びその写しのうち入学、卒業等の学籍に関する記録については、その保存期間は、[HOLE]年間とする。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 二十）</span>", correctAnswer: "二十", options: ["五", "十", "二十", "三十"] },
            { title: "学校教育法施行規則 第70条第1項（生徒指導主事）", text: "中学校には、[HOLE]指導主事を置くものとする。", correctAnswer: "生徒" },
            { title: "学校教育法施行規則 第71条第1項（進路指導主事）", text: "中学校には、[HOLE]指導主事を置くものとする。", correctAnswer: "進路" },
            { title: "学校教育法施行規則 第78条の二（部活動指導員）", text: "部活動指導員は、中学校におけるスポーツ、文化、科学等に関する教育活動...に係る[HOLE]的な指導に従事する。", correctAnswer: "技術" },
            { title: "学校教育法施行規則 第96条第1項（高等学校の卒業要件単位数）", text: "校長は、生徒の高等学校の全課程の修了を認めるに当つては、高等学校学習指導要領の定めるところにより、[HOLE]単位以上を修得した者について行わなければならない。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 七十四）</span>", correctAnswer: "七十四", options: ["六十", "七十", "七十四", "八十"] },
            { title: "学校教育法施行規則 第134条の二第1項（個別の教育支援計画）", text: "校長は、特別支援学校に在学する児童等について個別の[HOLE]計画（関係機関との連携の下に行う長期的な支援に関する計画をいう。）を作成しなければならない。", correctAnswer: "教育支援" },
            { title: "学校教育法施行規則 第136条（特別支援学級の編成数）", text: "特別支援学級の一学級の児童又は生徒の数は、法令に特別の定めのある場合を除き、[HOLE]人以下を標準とする。<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※漢数字で解答（例: 十五）</span>", correctAnswer: "十五", options: ["八", "十", "十二", "十五"] },
            { title: "学校教育法施行規則 別表第二（中学校の標準単位時間）", text: "別表第二（第七十三条関係）中学校の各教科等の授業時数【標準授業時数（1単位時間：[HOLE]分）】<br><span class=\"text-sm text-[#0f766e] font-bold mt-1 block\">※数字＋「分」で解答（例: 10分）</span>", correctAnswer: "50分", options: ["40分", "45分", "50分", "60分"] }
        ];

        const TIME_PER_QUESTION = 15;

        let testMode = 'descriptive'; 
        let parsedQuestions = [];     
        let userAnswers = [];         
        let currentQuestionIndex = 0; 
        let timerInterval = null;     
        let totalTimeLimit = 0;
        let timeLeft = 0;             

        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 0; 

        const screens = {
            start: document.getElementById('start-screen'),
            test: document.getElementById('test-screen'),
            result: document.getElementById('result-screen')
        };
        const els = {
            qCountSelect: document.getElementById('question-count-select'),
            displayScore: document.getElementById('display-score'),
            displayTestTime: document.getElementById('display-test-time'),
            
            menuBtn: document.getElementById('menu-btn'),
            fontSizeBtn: document.getElementById('font-size-btn'),
            timerContainer: document.querySelector('.timer-container'),
            timerText: document.getElementById('timer-text'),
            drawerOverlay: document.getElementById('drawer-overlay'),
            drawerMenu: document.getElementById('drawer-menu'),
            drawerList: document.getElementById('drawer-list'),
            closeMenuBtn: document.getElementById('close-menu-btn'),
            
            desktopSidebar: document.getElementById('desktop-sidebar'),
            qNumberTitle: document.getElementById('question-number-title'),
            qBody: document.getElementById('question-body'),
            inputArea: document.getElementById('input-area'),
            inputInstruction: document.getElementById('input-instruction'),
            qProgress: document.getElementById('question-progress'),
            
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            submitConfirmBtn: document.getElementById('submit-confirm-btn'),
            
            submitModal: document.getElementById('submit-modal'),
            modalCancelBtn: document.getElementById('modal-cancel-btn'),
            modalSubmitBtn: document.getElementById('modal-submit-btn'),
            
            scoreDisplay: document.getElementById('score-display'),
            timeTaken: document.getElementById('time-taken'),
            resultDetails: document.getElementById('result-details')
        };

        function initApp() {
            const allOpt = els.qCountSelect.querySelector('option[value="all"]');
            if (allOpt) {
                allOpt.textContent = `全問（${baseQuestions.length}問）`;
            }

            els.qCountSelect.addEventListener('change', updateStartScreen);
            updateStartScreen();

            document.getElementById('start-btn').addEventListener('click', startTest);
            
            els.prevBtn.addEventListener('click', () => navigateQuestion(-1));
            els.nextBtn.addEventListener('click', () => navigateQuestion(1));
            
            els.submitConfirmBtn.addEventListener('click', () => {
                els.submitModal.classList.remove('hidden');
            });
            els.modalCancelBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
            });
            els.modalSubmitBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
                finishTest();
            });
            
            els.menuBtn.addEventListener('click', openDrawer);
            els.closeMenuBtn.addEventListener('click', closeDrawer);
            els.drawerOverlay.addEventListener('click', closeDrawer);

            els.fontSizeBtn.addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {
                    'normal': 1,
                    'small': 0.85,
                    'xsmall': 0.7,
                    'large': 1.15
                };
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });
        }

        function updateStartScreen() {
            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);
            
            els.displayScore.textContent = `${count}点`;
            
            totalTimeLimit = count * TIME_PER_QUESTION;
            const minutes = Math.floor(totalTimeLimit / 60);
            const seconds = totalTimeLimit % 60;
            els.displayTestTime.textContent = `${minutes}分${seconds > 0 ? seconds + '秒' : ''}`;
        }

        function startTest() {
            const modeRadios = document.getElementsByName('test-mode');
            for (const radio of modeRadios) {
                if (radio.checked) testMode = radio.value;
            }

            generateQuestions();

            if (parsedQuestions.length === 0) {
                alert("出題可能な問題がありません。");
                return;
            }

            screens.start.classList.add('hidden');
            screens.test.classList.remove('hidden');
            screens.test.classList.add('flex');

            currentQuestionIndex = 0;
            renderQuestion(currentQuestionIndex);
            updateNavigations();
            
            startTimer();
        }

        function generateQuestions() {
            parsedQuestions = [];
            userAnswers = [];

            const allAnswersArray = Array.from(new Set(baseQuestions.map(q => q.correctAnswer)));

            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);

            const shuffledData = [...baseQuestions].sort(() => Math.random() - 0.5);
            const selectedData = shuffledData.slice(0, count);

            selectedData.forEach((q) => {
                let options = [];
                if (q.options) {
                    options = [...q.options];
                } else {
                    options = [q.correctAnswer];
                    const dummyOptions = allAnswersArray.filter(a => a !== q.correctAnswer).sort(() => Math.random() - 0.5);
                    options = options.concat(dummyOptions.slice(0, 3)); 
                    options.sort(() => Math.random() - 0.5); 
                }

                parsedQuestions.push({
                    title: q.title,
                    text: q.text,
                    correctAnswer: q.correctAnswer,
                    options: options,
                    forceSelect: q.forceSelect || false
                });
                
                userAnswers.push(""); 
            });
        }

        function renderQuestion(index) {
            const q = parsedQuestions[index];
            
            els.qNumberTitle.innerHTML = `【問題 ${index + 1}】<span class="text-sm ml-2 font-normal text-gray-700">（1点）- ${q.title}</span>`;
            const displayText = q.text.replace('[HOLE]', `<span class="font-bold px-1 text-teal-900">（　　　）</span>`).replace(/\n/g, '<br>');
            els.qBody.innerHTML = displayText;
            els.qProgress.textContent = `${index + 1} / ${parsedQuestions.length}`;

            els.inputArea.innerHTML = '';
            
            if (testMode === 'descriptive' && !q.forceSelect) {
                els.inputInstruction.textContent = "（　　　）に入る言葉を記述してください：";
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input fs-base';
                input.placeholder = "ここに入力";
                input.value = userAnswers[index];
                
                input.addEventListener('input', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(input);
            } else {
                els.inputInstruction.textContent = "（　　　）に入る言葉を選択してください：";
                const select = document.createElement('select');
                select.className = 'blank-select fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.textContent = "選択してください";
                select.appendChild(defaultOption);

                q.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (userAnswers[index] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(select);
            }

            els.prevBtn.disabled = index === 0;
            if (index === parsedQuestions.length - 1) {
                els.nextBtn.classList.add('hidden');
                els.submitConfirmBtn.classList.remove('hidden');
            } else {
                els.nextBtn.classList.remove('hidden');
                els.submitConfirmBtn.classList.add('hidden');
            }
        }

        function navigateQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < parsedQuestions.length) {
                currentQuestionIndex = newIndex;
                renderQuestion(currentQuestionIndex);
                updateNavigations(); 
            }
        }

        function updateNavigations() {
            updateSidebarList();
            updateDrawerList();
        }

        function updateSidebarList() {
            els.desktopSidebar.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const button = document.createElement('button');
                const isActive = idx === currentQuestionIndex;
                const isAnswered = userAnswers[idx].trim() !== "";
                
                let baseClass = "text-center px-4 py-2.5 rounded font-medium transition border shadow-sm fs-base ";
                if (isActive) {
                    baseClass += "bg-[#99f6e4] text-black border-[#5eead4] font-bold"; 
                } else if (isAnswered) {
                    baseClass += "bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200";
                } else {
                    baseClass += "bg-[#e2e8f0] text-gray-700 border-[#cbd5e1] hover:bg-[#cbd5e1]";
                }
                
                button.className = baseClass;
                button.innerHTML = `【問題${idx + 1}】`;
                
                button.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    updateNavigations();
                });
                
                els.desktopSidebar.appendChild(button);
            });
        }

        function updateDrawerList() {
            els.drawerList.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const li = document.createElement('li');
                const isActive = idx === currentQuestionIndex;
                const isAnswered = userAnswers[idx].trim() !== "";
                
                let bgClass = isActive 
                    ? 'bg-[#99f6e4] font-bold text-black border border-[#5eead4]' 
                    : isAnswered 
                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                        : 'bg-[#e2e8f0] border border-[#cbd5e1] text-gray-700 hover:bg-[#cbd5e1]';

                li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${bgClass}`;
                li.innerHTML = `<div class="text-center">【問題${idx + 1}】</div>`;
                
                li.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    closeDrawer(); 
                    updateNavigations();
                });
                
                els.drawerList.appendChild(li);
            });
        }

        function openDrawer() {
            els.drawerMenu.classList.remove('-translate-x-full');
            els.drawerOverlay.classList.remove('hidden');
        }

        function closeDrawer() {
            els.drawerMenu.classList.add('-translate-x-full');
            els.drawerOverlay.classList.add('hidden');
        }

        function startTimer() {
            timeLeft = totalTimeLimit; 
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 10) {
                    els.timerContainer.classList.add('text-red-600');
                    els.timerContainer.classList.remove('text-gray-800');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    els.submitModal.classList.add('hidden');
                    alert("制限時間終了です！自動的に採点します。");
                    finishTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
            const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
            els.timerText.textContent = `${m}:${s}`;
        }

        function normalizeString(str) {
            if (!str) return "";
            return str.replace(/[\s　]/g, '').toLowerCase();
        }

        function finishTest() {
            clearInterval(timerInterval);
            
            let correctCount = 0;
            els.resultDetails.innerHTML = '';

            parsedQuestions.forEach((q, idx) => {
                const userAnswer = userAnswers[idx];
                const isCorrect = normalizeString(userAnswer) === normalizeString(q.correctAnswer);
                if (isCorrect) correctCount++;

                const resultCard = document.createElement('div');
                resultCard.className = `p-4 rounded-lg border-l-4 ${isCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`;
                
                const icon = isCorrect 
                    ? `<span class="text-green-600 font-bold fs-xl">○ 正解</span>` 
                    : `<span class="text-red-600 font-bold fs-xl">× 不正解</span>`;

                const correctHtmlText = q.text.replace('[HOLE]', `<span class="font-bold border-b-2 border-teal-700 px-1 text-teal-900">（ ${q.correctAnswer} ）</span>`).replace(/\n/g, '<br>');

                const displayUserAnswer = userAnswer.trim() === "" ? "（未解答）" : userAnswer;

                resultCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-gray-800 fs-base">問題 ${idx + 1}: <span class="font-normal text-gray-600 fs-sm">${q.title}</span></h4>
                        ${icon}
                    </div>
                    <div class="text-gray-700 bg-white p-3 rounded border border-gray-200 mb-2 fs-lg">
                        ${correctHtmlText}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2 fs-sm">
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">あなたの解答</span>
                            <span class="font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${displayUserAnswer}</span>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">正解</span>
                            <span class="font-bold text-teal-700">${q.correctAnswer}</span>
                        </div>
                    </div>
                `;
                els.resultDetails.appendChild(resultCard);
            });

            els.scoreDisplay.textContent = `${correctCount}点 / ${parsedQuestions.length}点`;
            
            const timeTakenSec = totalTimeLimit - Math.max(0, timeLeft);
            const tm = Math.floor(timeTakenSec / 60);
            const ts = timeTakenSec % 60;
            els.timeTaken.textContent = `所要時間: ${tm}分 ${ts}秒`;

            screens.test.classList.add('hidden');
            screens.test.classList.remove('flex');
            screens.result.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
