    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #0ea5e9;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --sidebar-width: 200px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            overflow-x: hidden; /* ページ全体の横スクロールを完全に禁止 */
            width: 100%;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }

        /* --- サイドバー（共通） --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: white;
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-header {
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-menu { padding: 6px 0; }
        .nav-category {
            padding: 8px 16px 2px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            color: #64748b;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .nav-item:hover { background-color: #f1f5f9; color: var(--accent-color); }
        .nav-item i { margin-right: 8px; width: 14px; height: 14px; }
        .nav-item.active {
            color: var(--accent-color);
            background-color: #e0f2fe;
            font-weight: bold;
            border-right: 3px solid var(--accent-color);
        }

        /* --- モバイル用トグル --- */
        .mobile-toggle-btn {
            display: none;
            position: fixed;
            top: 10px; left: 10px; z-index: 2000;
            width: 36px; height: 36px;
            background-color: rgba(255, 255, 255, 0.9);
            border: none; border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer; color: var(--primary-color);
            align-items: center; justify-content: center;
        }
        .overlay {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 950; backdrop-filter: blur(2px);
        }
        .overlay.active { display: block; }

        @media (max-width: 768px) {
            .mobile-toggle-btn { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .sidebar-header { padding-left: 60px; }
        }

        /* --- メインコンテンツ --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            overflow-x: hidden; /* コンテンツ全体の横ブレを防ぐ */
            width: 100%;
        }
        @media (max-width: 768px) {
            .main-content { margin-left: 0; }
            .page-header { padding-left: 60px !important; }
        }

        .page-header {
            background-color: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 24px;
        }
        .breadcrumb {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .breadcrumb a { color: #94a3b8; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .container {
            width: 95%; max-width: 1000px;
            margin: 0 auto; padding: 24px 0; flex: 1;
        }

        /* --- タブUI --- */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            overflow-x: auto; /* モバイルで横スクロール可能に */
            scrollbar-width: none; /* Firefox用 */
        }
        .tabs::-webkit-scrollbar { display: none; } /* Chrome用スクロールバー非表示 */

        .tab-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 0.8rem;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            margin-bottom: -2px; /* 下線を重ねる */
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn i { width: 16px; height: 16px; }
        .tab-btn:hover { color: var(--accent-color); }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--accent-color);
        }

        /* タブコンテンツ */
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 目次リストスタイル --- */
        .chapter-block {
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .chapter-header {
            background: #f8fafc;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid #e2e8f0;
            border-left: 4px solid var(--accent-color);
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            padding: 16px;
        }
        
        /* リストアイテム (リンク) */
        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            transition: all 0.2s;
            background: white;
        }
        .list-item:hover:not(.disabled) {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            color: var(--accent-color);
        }
        
        /* 連番表示 */
        .item-number {
            font-family: monospace;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 12px;
            font-weight: bold;
        }

        .item-title { flex: 1; line-height: 1.3; }

        /* --- 非公開（準備中）のスタイル --- */
        .list-item.disabled {
            background: #f8fafc;
            border-style: dashed;
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none; /* クリック無効化 */
        }
        .status-badge-list {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #fee2e2;
            color: #ef4444;
            white-space: nowrap;
            margin-left: 8px;
            border: 1px solid #fca5a5;
        }

        /* --- 演習テーブル用スタイル --- */
        .section-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .table-container {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
        }

        .table-wrapper {
            overflow-x: auto; /* 表だけの横スクロールを有効化 */
            -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロールを有効化 */
            -ms-overflow-style: none;
            scrollbar-width: none;
            width: 100%;
        }
        .table-wrapper::-webkit-scrollbar {
            display: none;
        }
        
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px; /* デフォルトおよびPCでの最小幅を設定 */
            text-align: center;
            font-size: 0.85rem;
        }
        
        .custom-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: normal;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        
        .custom-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            color: #334155;
            vertical-align: middle;
        }
        
        .custom-table th:last-child,
        .custom-table td:last-child {
            border-right: none;
        }
        
        .custom-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .custom-table tbody tr:hover {
            background-color: #f8fafc;
            transition: background-color 0.2s ease;
        }
        
        .custom-table td.text-left {
            text-align: left;
            padding-left: 20px;
        }

        /* ステータスバッジ（テーブル用） */
        .status-badge {
            display: inline-block;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .status-active { background-color: #a0c832; }
        .status-prep { background-color: #4bc0c8; }

        /* リンクスタイル */
        .content-link {
            color: #2563eb;
            text-decoration: underline;
            font-weight: bold;
            transition: color 0.2s;
        }
        .content-link:hover { color: #1d4ed8; }
        .content-link.disabled {
            color: #94a3b8;
            text-decoration: underline;
            cursor: not-allowed;
        }

        /* PDFボタン */
        .btn-pdf {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-pdf.active {
            background-color: #ef4444;
            color: white;
            border: 1px solid #dc2626;
        }
        .btn-pdf.active:hover {
            background-color: #b91c1c;
        }
        .btn-pdf.disabled {
            background-color: #f8fafc;
            color: #cbd5e1;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
        }

        /* アクションボタン */
        .btn-action {
            display: inline-block;
            border: 1px solid #94a3b8;
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-action:hover { 
            background-color: #e2e8f0; 
            color: #1e293b;
        }
        .btn-disabled {
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
        }
        .btn-disabled:hover {
            background-color: #f8fafc;
            color: #cbd5e1;
        }

        /* カスタムスクロールバー（PCでは非表示） */
        .custom-scrollbar-container {
            display: none;
        }

        footer {
            background-color: white;
            border-top: 1px solid #e2e8f0;
            padding: 15px; text-align: center;
            color: #94a3b8; font-size: 0.7rem;
            margin-top: auto;
        }

        /* --- レスポンシブ対応 --- */
        @media (max-width: 768px) {
            .container { 
                padding: 16px; 
                width: 100%; 
                max-width: 100%; /* 横幅制限を厳密にし、はみ出しを防ぐ */
                box-sizing: border-box;
            }
            
            .section-box { 
                padding: 12px; 
                width: 100%;
                box-sizing: border-box;
            }

            .table-container {
                width: 100%;
                box-sizing: border-box;
            }

            .table-wrapper {
                width: 100%;
                overflow-x: auto; /* 表だけのスクロールを保証 */
                display: block;
            }
            
            .custom-table {
                min-width: 580px; /* スマートフォンで情報が潰れない適切な最小幅 */
                font-size: 0.75rem;
            }

            .custom-scrollbar-container {
                display: flex;
                align-items: center;
                background-color: #fdfdfd;
                border-top: 1px solid #e2e8f0;
                padding: 4px 12px;
                gap: 10px;
                width: 100%;
                box-sizing: border-box;
            }
            .scroll-btn {
                background: none;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .scroll-track {
                flex: 1;
                height: 8px;
                position: relative;
                background-color: #f1f5f9;
                border-radius: 10px;
            }
            .scroll-thumb {
                height: 100%;
                background-color: #888888; 
                border-radius: 10px;
                position: absolute;
                top: 0;
                left: 0;
                width: 30%;
            }

            /* 各列の幅比率を狭い画面向けに微調整 */
            .custom-table th:nth-child(1), .custom-table td:nth-child(1) { width: 45%; }
            .custom-table th:nth-child(2), .custom-table td:nth-child(2) { width: 12%; }
            .custom-table th:nth-child(3), .custom-table td:nth-child(3) { width: 18%; }
            .custom-table th:nth-child(4), .custom-table td:nth-child(4) { width: 15%; }
            .custom-table th:nth-child(5), .custom-table td:nth-child(5) { width: 10%; }
            
            .custom-table th, .custom-table td { padding: 10px 4px; }
            .custom-table td.text-left { padding-left: 8px; }
            .custom-table td:not(.text-left) { white-space: nowrap; }
            .status-badge { padding: 4px 6px; font-size: 0.65rem; }
            .btn-action { padding: 6px 8px; font-size: 0.65rem; }
        }
    </style>
</head>

        // --- 地理向け演習データ ---
        const practiceData = [
            { id: 1, name: "test", status: "prep", link: "#", pdfStatus: "prep", pdfLink: "#", updatedAt: "2026/05/27" }
        ];

        // 全体通し番号用のカウンター
        let globalCounter = 1;

        // 目次HTMLを生成してDOMに挿入する関数
        function renderContent(tabId, dataArray) {
            const container = document.getElementById(tabId);
            let html = '';

            dataArray.forEach(chapter => {
                let itemsHtml = chapter.items.map(item => {
                    let currentNumber = null;
                    let numHtml = '';

                    // 連番の生成（hideNumber: true の場合は振らない）
                    if (!item.hideNumber) {
                        currentNumber = globalCounter;
                        numHtml = `<span class="item-number">${String(currentNumber).padStart(3, '0')}</span>`;
                        globalCounter++;
                    }

                    const isItemPublished = item.isPublished || (currentNumber !== null && publishedItemNumbers.includes(currentNumber));
                    const disabledClass = isItemPublished ? "" : "disabled";
                    const targetUrl = isItemPublished ? item.url : "javascript:void(0)";
                    const targetAttr = (isItemPublished && item.isExternal) ? 'target="_blank" rel="noopener noreferrer"' : '';
                    const badgeHtml = isItemPublished ? '' : '<span class="status-badge-list">準備中</span>';
                    
                    return `
                        <a href="${targetUrl}" class="list-item ${disabledClass}" ${targetAttr}>
                            ${numHtml}
                            <span class="item-title">${item.title}</span>
                            ${badgeHtml}
                        </a>
                    `;
                }).join('');

                html += `
                    <div class="chapter-block">
                        <div class="chapter-header">${chapter.chapter}</div>
                        <div class="items-grid">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 演習テーブルの生成関数
        function renderPracticeTable() {
            const tbody = document.getElementById('test-list-body');
            if (!tbody) return;
            tbody.innerHTML = ''; 

            practiceData.forEach(test => {
                const tr = document.createElement('tr');

                const isActive = test.status === "active";
                const statusLabel = isActive ? "テスト受付中" : "テスト準備中";
                const statusClass = isActive ? "status-active" : "status-prep";
                
                const isPdfActive = test.pdfStatus === "active";
                
                const linkHtml = isActive 
                    ? `<a href="${test.link}" class="content-link">${test.name}</a>` 
                    : `<span class="content-link disabled">${test.name}</span>`;

                const pdfBtnHtml = isPdfActive
                    ? `<a href="${test.pdfLink}" target="_blank" class="btn-pdf active" title="PDFを開く">PDF</a>`
                    : `<span class="btn-pdf disabled" title="PDF準備中">PDF</span>`;

                const btnHtml = isActive
                    ? `<a href="${test.link}" class="btn-action">テスト実施</a>`
                    : `<button disabled class="btn-action btn-disabled">テスト実施</button>`;

                tr.innerHTML = `
                    <td class="text-left">${linkHtml}</td>
                    <td>${pdfBtnHtml}</td>
                    <td>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </td>
                    <td style="color: #64748b;">${test.updatedAt}</td>
                    <td>${btnHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初期描画
        document.addEventListener('DOMContentLoaded', () => {

            renderContent('links', geographyData.links);

            // リサイズ時にスクロールバー更新
            window.addEventListener('resize', updateScrollThumb);
        });

        // タブ切り替え制御
        function switchTab(tabId) {
            // ボタンのアクティブ状態切り替え
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // コンテンツのアクティブ状態切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            // 演習タブが表示された時、スクロールバーの計算をやり直す
            if (tabId === 'practice') {
                setTimeout(updateScrollThumb, 50);
            }
        }

        // --- カスタムスクロールバーの制御 ---
        const tableWrapper = document.getElementById('tableWrapper');
        const scrollThumb = document.getElementById('scrollThumb');
        const scrollTrack = document.getElementById('scrollTrack');
        const scrollLeftBtn = document.getElementById('scrollLeftBtn');
        const scrollRightBtn = document.getElementById('scrollRightBtn');

        function updateScrollThumb() {
            if (!tableWrapper || !scrollThumb || !scrollTrack) return;
            
            const wrapperWidth = tableWrapper.clientWidth;
            const scrollWidth = tableWrapper.scrollWidth;
            
            if (scrollWidth <= wrapperWidth || wrapperWidth === 0) {
                scrollThumb.style.width = '100%';
                scrollThumb.style.left = '0px';
                return;
            }
            
            const trackWidth = scrollTrack.clientWidth;
            const thumbWidth = (wrapperWidth / scrollWidth) * trackWidth;
            scrollThumb.style.width = `${Math.max(thumbWidth, 30)}px`;
            
            const scrollLeft = tableWrapper.scrollLeft;
            const maxScrollLeft = scrollWidth - wrapperWidth;
            const maxThumbLeft = trackWidth - parseFloat(scrollThumb.style.width);
            
            const thumbLeft = (scrollLeft / maxScrollLeft) * maxThumbLeft;
            scrollThumb.style.left = `${thumbLeft}px`;
        }

        if (tableWrapper) {
            tableWrapper.addEventListener('scroll', updateScrollThumb);
        }

        if (scrollLeftBtn) {
            scrollLeftBtn.addEventListener('click', () => {
                tableWrapper.scrollBy({ left: -150, behavior: 'smooth' });
            });
        }

        if (scrollRightBtn) {
            scrollRightBtn.addEventListener('click', () => {
                tableWrapper.scrollBy({ left: 150, behavior: 'smooth' });
            });
        }

        // サイドバー制御（モバイル用）
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        const toggleSidebar = () => {
            const isActive = sidebar.classList.contains('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            menuToggle.innerHTML = isActive ? '<i data-lucide="menu"></i>' : '<i data-lucide="x"></i>';
            lucide.createIcons();
            document.body.style.overflow = isActive ? '' : 'hidden';
        };

        if(menuToggle) menuToggle.addEventListener('click', toggleSidebar);
        if(overlay) overlay.addEventListener('click', toggleSidebar);
    </script>
