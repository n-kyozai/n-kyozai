    <script>
        // 日本史：鎌倉幕府の成立と武士の社会 問題データ（全13点満点）
        const originalQuestions = [
            { 
                id: 1, 
                point: 6,
                pointPerItem: 1,
                inputCount: 6,
                ordered: true,
                labels: ["A", "B", "C", "D", "E", "F"],
                text: `次の文の（　）に適語を入れよ。`, 
                subQuestions: [
                    { 
                        text: "1180年、後白河法皇の子である以仁王の令旨をきっかけに、各地で平氏打倒の兵があがった。源頼朝は東国を固めて鎌倉を拠点とし、軍事組織かつ御家人を統率する機関として（ A ）をいち早く設置した。1183年には寿永二年十月宣旨により頼朝の東国支配権が公認され、翌1184年には一般政務や財政をおこなう公文所（のち（ B ）に改称）や、裁判をおこなう（ C ）が設置されて支配機構が整備された。", 
                        inputIndices: [0, 1, 2] 
                    },
                    { 
                        text: "源頼朝は源義経らを用いて平氏を追い詰め、1185年に（ D ）の戦いで平氏を滅亡させた。同年、義経逮捕を名目に後白河法皇に要求し、国ごとに（ E ）を、荘園や公領ごとに（ F ）を設置する権利（文治の勅許）を獲得して、実質的に日本全国へと支配権を拡大させた。そして、1192年に征夷大将軍に任命されたことで鎌倉幕府が名実ともに確立した。", 
                        inputIndices: [3, 4, 5] 
                    }
                ],
                options: [
                    ["侍所", "問注所", "政所", "評定衆"],
                    ["政所", "問注所", "内管領", "評定衆"],
                    ["問注所", "侍所", "留守所", "政所"],
                    ["壇の浦", "一の谷", "屋島", "富士川"],
                    ["守護", "地頭", "目代", "追捕使"],
                    ["地頭", "守護", "荘官", "国司"]
                ],
                answer: ["侍所", "政所", "問注所", "壇の浦", "守護", "地頭"],
                displayAnswer: "A. 侍所\nB. 政所\nC. 問注所\nD. 壇の浦\nE. 守護\nF. 地頭",
                explanation: "【解説】\n・（A）侍所（1180年設置）：御家人を統率し、軍事・警察を担いました。初代別当（長官）は和田義盛です。\n・（B）公文所・政所（1184年設置）：一般政務と財政を掌る公文所は、1192年の頼朝の征夷大将軍就任にともない「政所」へと改称。別当には初代大江広元らが就任しました。\n・（C）問注所（1184年設置）：訴訟や裁判の実務を扱いました。執事には三善康信が起用されました。\n・（D）壇の浦の戦い（1185年）：現在の山口県下関市周辺で平氏が滅亡した決戦です。\n・（E・F）守護・地頭（1185年設置）：後白河法皇から得た「文治の勅許」を背景に設置。国ごとに置かれた「守護」は軍事・警察権（大犯三箇条：大番催促・謀叛人の逮捕・殺害人の逮捕）を担い、「地頭」は荘園や公領に置かれて年貢の徴収や管理をおこないました。これによって、幕府の支配権は東国から全国へと浸透しました。"
            },
            {
                id: 2,
                point: 4,
                pointPerItem: 1,
                inputCount: 4,
                ordered: true,
                labels: ["①", "②", "③", "④"],
                text: `次の文の（　）に適語を入れよ。`,
                subQuestions: [
                    { 
                        text: "源頼朝の死後、北条氏が「執権」として実権を握り執権政治が展開された。これを好機とみた後鳥羽上皇は、1221年に幕府打倒を目指して（ ① ）の乱を起こした。この未曾有の危機に対し、頼朝の妻で尼将軍と呼ばれた（ ② ）が御家人を前にして伝説的な演説をおこない、頼朝の「御恩」を説くことで御家人の動揺を鎮め、大団結した幕府軍により上皇方を鎮圧した。", 
                        inputIndices: [0, 1] 
                    },
                    { 
                        text: "乱後、幕府は後鳥羽上皇ら3上皇を配流し、朝廷の監視、京都の警備、西国の軍事裁判を担う（ ③ ）を京都（旧平重盛邸跡）に新設した。また、1232年には、3代執権北条泰時が、武家社会の道理やこれまでの慣習（先例）を明文化した、最初の武家法である（ ④ ）（貞永式目）を制定した。これは京都の公家法や荘園領主の本所法とは並立するものだった。", 
                        inputIndices: [2, 3] 
                    }
                ],
                options: [
                    ["承久", "保元", "平治", "治承・寿永"],
                    ["北条政子", "平徳子", "巴御前", "日野富子"],
                    ["六波羅探題", "京都守護", "鎮西探題", "問注所"],
                    ["御成敗式目", "十七条の憲法", "武家諸法度", "建武式目"]
                ],
                answer: ["承久", "北条政子", "六波羅探題", "御成敗式目"],
                displayAnswer: "① 承久\n② 北条政子\n③ 六波羅探題\n④ 御成敗式目",
                explanation: "【解説】\n・（①・②）承久の乱（1221年）・北条政子の演説：後鳥羽上皇が北条義時討伐の院宣を出し挙兵。御家人たちの動揺に対し、北条政子が「頼朝公の恩は山よりも高く海よりも深い」と演説し、御家人の団結を勝ち得て、幕府軍が勝利しました。\n・（③）六波羅探題：従来の京都守護を廃して新設。初代探題には北条泰時・北条時房が就任。これにより朝廷への監視体制が非常に強まり、幕府の支配力が西国にまで及ぶ決定機となりました。また、乱で上皇側から没収した約3000箇所の領地には新しく地頭（新補地頭）が置かれました。\n・（④）御成敗式目（貞永式目、1232年）：執権・北条泰時が制定。全51条。律令法などの知識がない御家人でも理解できるよう、平易な表現で「道理」や武家社会の「先例（慣習）」に基づいて規定。あくまで幕府の支配地（守護・地頭の管轄下）でのみ適用され、京都や荘園領主の支配下では「公家法」「本所法」が引き続き用いられました。"
            },
            {
                id: 3,
                point: 3,
                pointPerItem: 1,
                inputCount: 3,
                ordered: true,
                labels: ["①", "②", "③"],
                text: `次の文の（　）に適語を入れよ。`,
                subQuestions: [
                    { 
                        text: "将軍と御家人は、「御恩」と「奉公」という双方向の強い主従関係（封建制度）で結ばれていた。将軍側から与えられる御恩には、御家人先祖代々の所領の支配を公認する（ ① ）や、勲功に応じて新たな土地を給与する新恩給与があった。", 
                        inputIndices: [0] 
                    },
                    { 
                        text: "これに対し、御家人側が果たす奉公には、いざという合戦時の軍役のほかに、平時の警備任務である京都大番役や（ ② ）役などがあった。", 
                        inputIndices: [1] 
                    },
                    { 
                        text: "武士の社会は、一族の長（首長）である（ ③ ）が庶子を統率する（ ③ ）制により結束を維持した。また、一族の領地は所領を分割して相続する「分割相続」が基本であり、初期には女性（女子御家人）にも相続権（一定期間の支配を認める一期分など）が認められていた。", 
                        inputIndices: [2] 
                    }
                ],
                options: [
                    ["本領安堵", "成功", "知行国", "一期分"],
                    ["鎌倉番役", "国役", "検田使", "目代"],
                    ["惣領", "家子", "郎等", "地頭"]
                ],
                answer: ["本領安堵", "鎌倉番役", "惣領"],
                displayAnswer: "① 本領安堵\n② 鎌倉番役\n③ 惣領",
                explanation: "【解説】\n・（①）本領安堵（ほんりょうあんど）：御恩の最も重要なもので、先祖から受け継いできた土地の所有権・支配権を将軍が公式に認めて保護することです。\n・（②）鎌倉番役（かまくらばんやく）：平時に御家人が鎌倉に赴き、将軍の御所や鎌倉市中の警備をおこなった奉公の義務です。これに対し、天皇や院の御所の警備任務を「京都大番役」と呼びました。\n・（③）惣領（そうりょう）制：武士一族の首長（惣領、本家）が、弟や親族（庶子、分家）を統率した血縁的・軍事的な結合組織。惣領は一族を代表して将軍への奉公（軍役など）を取りまとめ、所領の祭祀なども司りました。当初は一族の団結力が高かったため「分割相続」がおこなわれていましたが、のちの元寇などの対外防衛や生活困窮にともない、領地の細分化を防ぐために「単独相続」へと移行し、女性の相続権も制限されていきました。"
            }
        ];

        // 状態変数
        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {}; 

        // フォントサイズ切り替え用の設定
        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 1;

        // DOMContentLoaded イベントで初期化とイベントリスナーの登録を確実に行う
        document.addEventListener('DOMContentLoaded', () => {
            // DOM要素の取得
            const startScreen = document.getElementById('start-screen');
            const testScreen = document.getElementById('test-screen');
            const resultScreen = document.getElementById('result-screen');
            const questionContent = document.getElementById('question-content');
            const answerContainer = document.getElementById('answer-container');
            const questionNavList = document.getElementById('question-nav-list');
            const confirmModal = document.getElementById('confirm-modal');
            const drawerOverlay = document.getElementById('drawer-overlay');
            const drawerMenu = document.getElementById('drawer-menu');
            const drawerList = document.getElementById('drawer-list');

            // --- 関数定義 ---
            // モバイル用メニューの開閉イベント
            function openDrawer() {
                drawerMenu.classList.remove('-translate-x-full');
                drawerOverlay.classList.remove('hidden');
            }

            function closeDrawer() {
                drawerMenu.classList.add('-translate-x-full');
                drawerOverlay.classList.add('hidden');
            }

            // テスト開始処理
            function startTest() {
                questions = [...originalQuestions];
                currentQuestionIndex = 0;
                userAnswers = {};
                
                startScreen.classList.add('hidden');
                resultScreen.classList.add('hidden');
                testScreen.classList.remove('hidden');
                testScreen.classList.add('flex');

                renderNavList();
                renderQuestion();
            }

            // 左側の問題ナビゲーションとドロワーメニューの生成
            function renderNavList() {
                questionNavList.innerHTML = '';
                drawerList.innerHTML = '';

                questions.forEach((_, index) => {
                    // PC用
                    const navItem = document.createElement('div');
                    navItem.className = `p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 border-emerald-400 theme-text' : 'bg-gray-200 border-gray-300 hover:bg-gray-300'}`;
                    navItem.innerText = `【問題${index + 1}】`;
                    
                    navItem.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                    });
                    questionNavList.appendChild(navItem);

                    // モバイル用（ドロワーメニュー内）
                    const li = document.createElement('li');
                    li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${index === currentQuestionIndex ? 'bg-emerald-100 font-bold theme-text border border-emerald-400' : 'bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700'}`;
                    li.innerHTML = `<div class="text-center">【問題${index + 1}】</div>`;
                    
                    li.addEventListener('click', () => {
                        if (currentQuestionIndex !== index) {
                            saveAnswer();
                            currentQuestionIndex = index;
                            renderQuestion();
                        }
                        closeDrawer(); // 選択後に閉じる
                    });
                    drawerList.appendChild(li);
                });
            }

            // セレクトボックス生成
            function createSelectElement(q, i) {
                const select = document.createElement('select');
                select.className = 'answer-input multi-input shadow-sm appearance-none border border-gray-400 rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-1 theme-ring bg-white cursor-pointer fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                if (q.inputCount === 1 || !q.ordered) {
                    defaultOption.text = "選択してください";
                } else {
                    let prefix = q.labels ? q.labels[i] : '①②③④⑤⑥⑦⑧⑨⑩'[i];
                    defaultOption.text = `（${prefix}）を選択してください`;
                }
                defaultOption.disabled = true;
                defaultOption.selected = true;
                select.appendChild(defaultOption);

                q.options[i].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.text = opt;
                    if (userAnswers[q.id] && userAnswers[q.id][i] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
                return select;
            }

            // 問題の表示
            function renderQuestion() {
                const q = questions[currentQuestionIndex];
                document.getElementById('question-number').innerText = `【問題${currentQuestionIndex + 1}】（${q.point}点）`;
                document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

                questionContent.innerHTML = '';
                answerContainer.innerHTML = '';

                if (q.text) {
                    const p = document.createElement('div');
                    p.className = 'mb-6 leading-relaxed fs-lg text-gray-800 whitespace-pre-wrap font-semibold border-l-4 theme-border pl-3';
                    p.innerHTML = q.text;
                    questionContent.appendChild(p);
                }

                if (q.subQuestions) {
                    answerContainer.classList.add('hidden');

                    q.subQuestions.forEach((sub, i) => {
                        let subText = typeof sub === 'string' ? sub : sub.text;
                        let inputIndices = typeof sub === 'string' ? [i] : sub.inputIndices;

                        const subP = document.createElement('p');
                        subP.className = 'mb-4 leading-relaxed whitespace-pre-wrap fs-lg text-gray-800 bg-gray-50 p-4 border rounded shadow-sm';
                        
                        // （A）や（①）などの記号を少し目立たせる簡易置換
                        let decoratedText = subText;
                        if (q.labels) {
                            q.labels.forEach(lbl => {
                                decoratedText = decoratedText.replaceAll(`（ ${lbl} ）`, `<span class="px-2 py-0.5 mx-1 rounded bg-yellow-100 border border-yellow-300 font-bold theme-text">${lbl}</span>`);
                                decoratedText = decoratedText.replaceAll(`（${lbl}）`, `<span class="px-2 py-0.5 mx-1 rounded bg-yellow-100 border border-yellow-300 font-bold theme-text">${lbl}</span>`);
                            });
                        }
                        subP.innerHTML = decoratedText;
                        questionContent.appendChild(subP);

                        // 解答セレクトボックスの設置
                        inputIndices.forEach(idx => {
                            const selectWrap = document.createElement('div');
                            selectWrap.className = 'mb-6 bg-white p-4 border rounded shadow-sm';
                            
                            const label = document.createElement('label');
                            label.className = 'block font-bold text-gray-700 mb-2 fs-sm flex items-center gap-1';
                            
                            let prefix = q.labels ? q.labels[idx] : '①②③④⑤⑥⑦⑧⑨⑩'[idx];
                            let labelText = (!q.ordered || q.inputCount === 1) ? '解答を選択してください：' : `（${prefix}）に入る語句を選択してください：`;
                            label.innerHTML = `<span class="inline-block w-6 h-6 rounded-full theme-bg text-white text-center leading-6 text-xs font-bold mr-1">${prefix}</span> ${labelText}`;
                            selectWrap.appendChild(label);

                            const select = createSelectElement(q, idx);
                            selectWrap.appendChild(select);
                            
                            questionContent.appendChild(selectWrap);
                        });
                    });
                } else {
                    if (q.inputCount > 0) {
                        answerContainer.classList.remove('hidden');
                        const label = document.createElement('label');
                        label.className = 'block font-bold text-gray-700 mb-2 fs-sm';
                        label.innerText = '解答を選択してください：';
                        answerContainer.appendChild(label);

                        for(let i = 0; i < q.inputCount; i++) {
                            const selectWrap = document.createElement('div');
                            selectWrap.className = 'mb-3';
                            const select = createSelectElement(q, i);
                            selectWrap.appendChild(select);
                            answerContainer.appendChild(selectWrap);
                        }
                    } else {
                        answerContainer.classList.add('hidden');
                    }
                }

                // ナビゲーションの色更新
                Array.from(questionNavList.children).forEach((el, idx) => {
                    if (idx === currentQuestionIndex) {
                        el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base bg-emerald-100 border-emerald-400 theme-text';
                    } else {
                        el.className = 'p-2 border rounded font-bold text-center cursor-pointer transition-colors fs-base bg-gray-200 border-gray-300 hover:bg-gray-300';
                    }
                });
                Array.from(drawerList.children).forEach((li, idx) => {
                    if (idx === currentQuestionIndex) {
                        li.className = 'p-3 mb-1 rounded cursor-pointer transition fs-base bg-emerald-100 font-bold theme-text border border-emerald-400';
                    } else {
                        li.className = 'p-3 mb-1 rounded cursor-pointer transition fs-base bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-700';
                    }
                });

                // ボタン制御
                document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
                if (currentQuestionIndex === questions.length - 1) {
                    document.getElementById('next-btn').classList.add('hidden');
                    document.getElementById('finish-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('finish-btn').classList.add('hidden');
                }

                // スクロールリセット
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0; 
                    document.documentElement.scrollTop = 0;
                }, 10);
            }

            function saveAnswer() {
                const q = questions[currentQuestionIndex];
                if (q.inputCount) {
                    const inputs = testScreen.querySelectorAll('.multi-input');
                    userAnswers[q.id] = Array.from(inputs).map(input => input.value);
                }
            }

            function executeScoring() {
                testScreen.classList.add('hidden');
                testScreen.classList.remove('flex');
                resultScreen.classList.remove('hidden');
                confirmModal.classList.add('hidden');

                let score = 0;
                let totalPoints = 0;
                const resultContainer = document.getElementById('result-list');
                resultContainer.innerHTML = '';

                questions.forEach((q, index) => {
                    totalPoints += q.point;
                    let earnedPoint = 0;
                    let isCorrect = false;
                    let displayUserAnswer = "";

                    if (q.inputCount) {
                        const userAnsArray = userAnswers[q.id] || Array(q.inputCount).fill("");
                        let matchCount = 0;

                        if (q.ordered) {
                            q.answer.forEach((correctWord, i) => {
                                if (userAnsArray[i] === correctWord) {
                                    matchCount++;
                                }
                            });
                        } else {
                            const normalizedUserAns = [...new Set(userAnsArray.filter(ans => ans !== ''))];
                            q.answer.forEach(correctWord => {
                                if (normalizedUserAns.includes(correctWord)) {
                                    matchCount++;
                                }
                            });
                        }
                        
                        earnedPoint = matchCount * q.pointPerItem;
                        isCorrect = earnedPoint === q.point; 

                        displayUserAnswer = userAnsArray.map((ans, idx) => {
                            const prefix = (q.inputCount > 1 && q.ordered) ? (q.labels ? q.labels[idx] : `①②③④⑤⑥⑦⑧⑨⑩`[idx]) + " " : "";
                            return ans.trim() === "" ? `${prefix}<span class='text-gray-400'>未選択</span>` : `${prefix}${ans}`;
                        }).join('\n');
                    }
                    
                    score += earnedPoint;

                    let markHtml = '';
                    if (earnedPoint === q.point) {
                        markHtml = '<span class="text-red-600 font-bold mr-2 text-2xl">○</span>';
                    } else if (earnedPoint > 0) {
                        markHtml = '<span class="text-yellow-600 font-bold mr-2 text-2xl">△</span>';
                    } else {
                        markHtml = '<span class="text-blue-600 font-bold mr-2 text-2xl">×</span>';
                    }

                    const explanationHtml = q.explanation ? q.explanation : '';
                    
                    let fullTextHtml = `<div class="mb-4 leading-relaxed fs-lg text-gray-800 font-semibold whitespace-pre-wrap">${q.text}</div>`;
                    if (q.subQuestions) {
                        const subList = q.subQuestions.map(sq => {
                            let text = typeof sq === 'string' ? sq : sq.text;
                            // 採点画面でも穴あきを少し目立たせる
                            let decoratedText = text;
                            if (q.labels) {
                                q.labels.forEach(lbl => {
                                    decoratedText = decoratedText.replaceAll(`（ ${lbl} ）`, `<span class="px-2 py-0.5 mx-1 rounded bg-yellow-100 border border-yellow-300 font-bold theme-text">${lbl}</span>`);
                                    decoratedText = decoratedText.replaceAll(`（${lbl}）`, `<span class="px-2 py-0.5 mx-1 rounded bg-yellow-100 border border-yellow-300 font-bold theme-text">${lbl}</span>`);
                                });
                            }
                            return `<p class="mb-3 p-3 bg-gray-50 border rounded text-gray-800 whitespace-pre-wrap fs-lg">${decoratedText}</p>`;
                        }).join('');
                        fullTextHtml += `<div class="mb-6">${subList}</div>`;
                    }

                    const itemHtml = `
                        <div class="border border-gray-300 rounded shadow-sm bg-white overflow-hidden">
                            <div class="bg-emerald-50 px-4 py-2 border-b border-gray-300 text-gray-800 font-bold flex items-center fs-base">
                                ${markHtml}
                                【問題${index + 1}】（${q.point}点）
                            </div>
                            <div class="p-4 md:p-6">
                                ${fullTextHtml}
                                <table class="w-full border-collapse">
                                    <tbody>
                                        <tr>
                                            <th class="w-1/3 md:w-1/4 theme-bg text-white p-2 border border-gray-300 text-left fs-sm">正解</th>
                                            <td class="p-2 border border-gray-300 font-bold whitespace-pre-wrap fs-sm">${q.displayAnswer}</td>
                                        </tr>
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">あなたの解答</th>
                                            <td class="p-2 border border-gray-300 whitespace-pre-wrap fs-sm ${isCorrect ? '' : (earnedPoint > 0 ? 'text-yellow-700 font-bold' : 'text-red-600 font-bold')}">${displayUserAnswer}</td>
                                        </tr>
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">得点</th>
                                            <td class="p-2 border border-gray-300 font-bold fs-sm">${earnedPoint}点 ／ ${q.point}点</td>
                                        </tr>
                                        ${explanationHtml ? `
                                        <tr>
                                            <th class="theme-bg text-white p-2 border border-gray-300 text-left fs-sm">解説</th>
                                            <td class="p-2 border border-gray-300 text-gray-700 whitespace-pre-wrap leading-relaxed fs-sm bg-stone-50">${explanationHtml}</td>
                                        </tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    resultContainer.insertAdjacentHTML('beforeend', itemHtml);
                });

                document.getElementById('total-score').innerText = `${score}点 / ${totalPoints}点`;

                // 一番上へスクロール
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0; 
                    document.documentElement.scrollTop = 0;
                }, 10);
            }

            // --- イベントリスナーの登録 ---
            
            // フォントサイズ変更
            document.getElementById('font-size-btn').addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {
                    'normal': 1,
                    'small': 0.85,
                    'xsmall': 0.7,
                    'large': 1.15
                };
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });

            // ドロワー関連
            document.getElementById('mobile-menu-btn').addEventListener('click', openDrawer);
            document.getElementById('close-menu-btn').addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            // テスト進行関連
            document.getElementById('start-btn').addEventListener('click', startTest);
            
            document.getElementById('restart-test-btn').addEventListener('click', () => {
                resultScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                saveAnswer();
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion();
                }
            });

            document.getElementById('prev-btn').addEventListener('click', () => {
                saveAnswer();
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    renderQuestion();
                }
            });

            testScreen.addEventListener('change', (e) => {
                if (e.target.classList.contains('answer-input')) {
                    saveAnswer();
                }
            });

            // 提出モーダル関連
            document.getElementById('finish-btn').addEventListener('click', () => {
                saveAnswer();
                confirmModal.classList.remove('hidden');
            });
            document.getElementById('modal-cancel-btn').addEventListener('click', () => {
                confirmModal.classList.add('hidden');
            });
            document.getElementById('modal-ok-btn').addEventListener('click', () => {
                executeScoring();
            });
            
        }); // DOMContentLoaded の終了
    </script>
</body>
</html>
