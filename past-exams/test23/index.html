<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教員採用試験対策：日本国憲法クイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* フォントサイズ手動切り替え用のスケール変数 */
        :root {
            --font-scale: 1;
        }
        /* htmlの基本フォントサイズをスケールさせることで、Tailwindのrem単位が全体的に拡大縮小する */
        html {
            font-size: calc(16px * var(--font-scale));
        }

        /* ヘッダーやアクセントのカラー */
        .header-bg { background-color: #1e3a8a; } /* ディープブルー */
        
        /* タイマー枠の固定 */
        .timer-box {
            font-variant-numeric: tabular-nums;
        }

        /* 記述式の入力欄スタイル */
        .blank-input {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .blank-input:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.2);
        }

        /* 選択式のセレクトボックススタイル */
        .blank-select {
            border: 1px solid #cbd5e1;
            background-color: #fff;
            padding: 8px 32px 8px 12px;
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            outline: none;
            color: #333;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            transition: border-color 0.2s;
        }
        .blank-select:focus {
            border-color: #1e3a8a;
        }

        /* サイドバー用カスタムスクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Typography classes */
        .fs-base { font-size: calc(1rem * var(--font-scale)) !important; line-height: calc(1.5rem * var(--font-scale)) !important; }
        .fs-lg { font-size: calc(1.125rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-xl { font-size: calc(1.25rem * var(--font-scale)) !important; line-height: calc(1.75rem * var(--font-scale)) !important; }
        .fs-2xl { font-size: calc(1.5rem * var(--font-scale)) !important; line-height: calc(2rem * var(--font-scale)) !important; }
        .fs-5xl { font-size: calc(3rem * var(--font-scale)) !important; line-height: calc(1) !important; }
        .fs-sm { font-size: calc(0.875rem * var(--font-scale)) !important; line-height: calc(1.25rem * var(--font-scale)) !important; }

        /* 採点結果画面用のフォントサイズ設定 */
        .result-screen-font {
            font-size: calc(0.875rem * var(--font-scale)) !important;
            line-height: calc(1.35rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-title {
            font-size: calc(1.25rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-score {
            font-size: calc(2.5rem * var(--font-scale)) !important;
        }
        .result-screen-font .res-lbl {
            font-size: calc(1rem * var(--font-scale)) !important;
        }
        .result-screen-font .fs-lg {
            font-size: calc(0.95rem * var(--font-scale)) !important;
            line-height: calc(1.4rem * var(--font-scale)) !important;
        }
        .result-screen-font .fs-sm {
            font-size: calc(0.8rem * var(--font-scale)) !important;
            line-height: calc(1.15rem * var(--font-scale)) !important;
        }
        .result-screen-font h4 {
            font-size: calc(0.95rem * var(--font-scale)) !important;
        }
    </style>
</head>
<body class="bg-[#f1f5f9] text-gray-800 font-sans min-h-screen flex flex-col fs-base transition-none">

    <!-- ドロワーメニュー用オーバーレイ (モバイル用) -->
    <div id="drawer-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity"></div>

    <!-- ドロワーメニュー本体 (モバイル用) -->
    <nav id="drawer-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col md:hidden">
        <div class="header-bg text-white p-4 flex justify-between items-center">
            <span class="font-bold fs-base">問題リスト</span>
            <button id="close-menu-btn" class="p-1 hover:bg-white hover:bg-opacity-20 rounded focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <ul id="drawer-list" class="flex-1 overflow-y-auto p-2 custom-scrollbar">
            <!-- JSでリストを生成 -->
        </ul>
    </nav>

    <!-- メインコンテンツ領域 -->
    <main class="flex-1 py-8 px-4 md:px-8 max-w-5xl mx-auto w-full">
        
        <!-- ================= スタート画面 ================= -->
        <section id="start-screen" class="w-full mx-auto">
            <div class="bg-white border border-gray-300 w-full mb-6 flex flex-col shadow-sm rounded-lg overflow-hidden">
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">テスト名</div>
                    <div class="w-2/3 md:w-3/4 p-3 font-bold fs-sm">教員採用試験対策：日本国憲法 穴埋めクイズ</div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">テスト範囲</div>
                    <div class="w-2/3 md:w-3/4 p-3 leading-relaxed fs-sm">日本国憲法（前文、平和主義、基本的人権、教育権、統治機構、最高法規など）</div>
                </div>
                <!-- 出題数のプルダウン選択 -->
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">出題数</div>
                    <div class="w-2/3 md:w-3/4 p-3 fs-sm">
                        <select id="question-count-select" class="border border-gray-300 rounded p-1.5 focus:border-[#1e3a8a] outline-none fs-sm">
                            <option value="5">5問</option>
                            <option value="10" selected>10問</option>
                            <option value="20">20問</option>
                            <option value="30">30問</option>
                            <option value="all">全問（45問）</option>
                        </select>
                    </div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">満点</div>
                    <div id="display-score" class="w-2/3 md:w-3/4 p-3 fs-sm">計算中...</div>
                </div>
                <div class="flex border-b border-gray-300">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">テスト時間</div>
                    <div id="display-test-time" class="w-2/3 md:w-3/4 p-3 fs-sm">計算中...</div>
                </div>
                <div class="flex">
                    <div class="w-1/3 md:w-1/4 bg-[#1e3a8a] text-white p-3 font-bold flex items-center fs-sm">問題出題形式</div>
                    <div class="w-2/3 md:w-3/4 p-3 fs-sm">ランダム</div>
                </div>
            </div>

            <div class="mb-8 flex justify-center gap-6 bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                <span class="font-bold text-gray-700 fs-base">解答形式：</span>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="descriptive" class="w-4 h-4 text-[#1e3a8a] focus:ring-[#1e3a8a]" checked>
                    <span class="ml-2 text-gray-800 font-medium fs-base">記述式（直接入力）</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="test-mode" value="multiple-choice" class="w-4 h-4 text-[#1e3a8a] focus:ring-[#1e3a8a]">
                    <span class="ml-2 text-gray-800 font-medium fs-base">選択式（ドロップダウン）</span>
                </label>
            </div>

            <div class="flex justify-center gap-4">
                <a href="https://n-kyozai.github.io/n-kyozai/past-exams/index.html" class="bg-[#6c757d] hover:bg-gray-600 text-white font-bold py-2.5 px-6 rounded shadow transition fs-base inline-block">
                    テスト一覧へ
                </a>
                <button id="start-btn" class="header-bg hover:bg-[#1e1b4b] text-white font-bold py-2.5 px-8 rounded shadow transition fs-base">
                    テスト開始
                </button>
            </div>
        </section>

        <!-- ================= テスト画面 ================= -->
        <section id="test-screen" class="hidden flex-col md:flex-row gap-4 lg:gap-8 items-start w-full">
            
            <!-- デスクトップ用 左サイドバー -->
            <div id="desktop-sidebar" class="hidden md:flex flex-col gap-2 w-48 shrink-0 max-h-[calc(100vh-8rem)] overflow-y-auto custom-scrollbar pr-2 sticky top-8">
                <!-- JSでサイドバーのボタンを生成 -->
            </div>

            <!-- 右側 メインエリア -->
            <div class="flex-1 w-full flex flex-col">
                
                <!-- ヘッダーバー (科目・タイトル & 残り時間) -->
                <div class="bg-[#e2e8f0] p-2 md:p-3 rounded-lg border border-gray-300 mb-4 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-2">
                        <!-- モバイル用メニューボタン -->
                        <button id="menu-btn" class="md:hidden p-1.5 rounded bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 transition" aria-label="メニューを開く">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <span class="font-bold text-gray-700 ml-1 fs-base">日本国憲法</span>
                    </div>
                    
                    <div class="flex items-center gap-2 sm:gap-3">
                        <!-- フォントサイズ切り替えボタン -->
                        <button id="font-size-btn" class="border border-gray-400 bg-white rounded px-2 py-1 flex items-center justify-center font-bold text-gray-700 shadow-sm hover:bg-gray-100 focus:outline-none transition" style="font-size: 14px; line-height: 1.2;">
                            ぁあ
                        </button>
                        
                        <!-- 残り時間表示 -->
                        <div class="bg-white px-3 py-1 rounded border border-gray-300 font-bold text-gray-800 flex items-center justify-center timer-container tabular-nums w-32 md:w-40 shrink-0 fs-lg">
                            残り時間 <span id="timer-text" class="ml-1 md:ml-2 font-mono">00:00</span>
                        </div>
                    </div>
                </div>

                <!-- 問題枠 -->
                <div class="bg-white rounded-lg border border-gray-300 shadow-sm flex flex-col mb-4 overflow-hidden">
                    <!-- タイトル -->
                    <div class="bg-[#dbeafe] p-3 md:p-4 border-b border-gray-300">
                        <h2 id="question-number-title" class="font-bold text-gray-800 fs-base">
                            <!-- JSで生成 -->
                        </h2>
                    </div>
                    <!-- 問題文と解答欄 -->
                    <div class="p-6 md:p-8 flex flex-col gap-6 md:gap-8">
                        <div id="question-body" class="text-gray-800 leading-relaxed min-h-[60px] fs-lg">
                            <!-- JSで生成 -->
                        </div>
                        
                        <!-- 解答エリア (グレー枠) -->
                        <div class="bg-[#f8fafc] border border-gray-200 rounded-lg p-4 md:p-6">
                            <p id="input-instruction" class="text-gray-700 mb-3 font-medium fs-sm">（　　　）に入る言葉を記述してください：</p>
                            <div id="input-area">
                                <!-- JSで input/select を挿入 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- フッターナビゲーション -->
                <div class="flex justify-between items-center mt-2">
                    <button id="prev-btn" class="bg-[#94a3b8] hover:bg-[#64748b] text-white font-bold py-2 px-8 rounded-lg shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed fs-base">
                        前へ
                    </button>
                    <div class="flex items-center gap-6">
                        <span id="question-progress" class="text-gray-600 font-bold fs-base">1 / 10</span>
                        <button id="next-btn" class="header-bg hover:bg-[#1e1b4b] text-white font-bold py-2 px-8 rounded-lg shadow-sm transition fs-base">
                            次へ
                        </button>
                        <button id="submit-confirm-btn" class="bg-[#d97706] hover:bg-[#b45309] text-white font-bold py-2 px-8 rounded-lg shadow-sm transition hidden fs-base">
                            テスト提出
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 確認モーダル ================= -->
        <div id="submit-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex justify-center items-center backdrop-blur-sm px-4">
            <div class="bg-white rounded-lg p-8 max-w-sm w-full shadow-2xl text-center mx-4 border border-gray-200">
                <p class="font-bold text-gray-800 mb-8 fs-lg">テストを提出して採点しますか？</p>
                <div class="flex justify-center gap-4">
                    <button id="modal-cancel-btn" class="bg-[#cbd5e1] hover:bg-[#94a3b8] text-gray-800 font-bold py-2.5 px-8 rounded-lg transition fs-base">
                        いいえ
                    </button>
                    <button id="modal-submit-btn" class="bg-[#f59e0b] hover:bg-[#d97706] text-white font-bold py-2.5 px-8 rounded-lg transition fs-base">
                        はい
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= 結果画面 ================= -->
        <section id="result-screen" class="hidden result-screen-font">
            <div class="bg-white rounded-lg shadow-md p-6 md:p-8 text-center mb-6 border border-gray-200">
                <h2 class="font-bold text-gray-800 mb-2 border-b-2 border-[#1e3a8a] pb-2 res-title">採点結果</h2>
                <p class="text-gray-600 mb-1 mt-6 res-lbl">あなたの得点</p>
                <div class="font-bold text-[#1e3a8a] mb-3 res-score" id="score-display">
                    -- / --
                </div>
                <p id="time-taken" class="text-gray-600 mb-4 font-medium res-lbl">所要時間: --分 --秒</p>
            </div>

            <div class="bg-white rounded-lg shadow-md p-4 md:p-6 mb-8 border border-gray-200">
                <h3 class="font-bold border-b border-gray-300 pb-2 mb-4 res-title">解説・詳細</h3>
                <div id="result-details" class="flex flex-col gap-4">
                    <!-- JSで結果詳細を生成 -->
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <a href="https://n-kyozai.github.io/n-kyozai/past-exams/index.html" class="bg-[#6c757d] hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg shadow transition fs-base inline-block">
                    テスト一覧へ
                </a>
                <button onclick="location.reload();" class="header-bg hover:bg-[#1e1b4b] text-white font-bold py-3 px-8 rounded-lg shadow transition fs-base">
                    もう一度挑戦する
                </button>
            </div>
        </section>

    </main>

    <script>
        // --- 日本国憲法 穴埋め問題データベース（教員採用試験頻出条文） ---
        const baseQuestions = [
            // 前文
            { title: "日本国憲法 前文", text: "日本国民は、正当に選挙された国会における代表者を通じて行動し、…ここに[HOLE]が国民に存することを宣言し、この憲法を確定する。", correctAnswer: "主権" },
            { title: "日本国憲法 前文", text: "そもそも国政は、国民の厳粛な信託によるものであつて、その権威は国民に由来し、その権力は国民の代表者がこれを行使し、その[HOLE]は国民がこれを享受する。", correctAnswer: "福利" },
            { title: "日本国憲法 前文", text: "日本国民は、[HOLE]の平和を念願し、人間相互の関係を支配する崇高な理想を深く自覚するのであつて、", correctAnswer: "恒久" },
            { title: "日本国憲法 前文", text: "われらは、全世界の国民が、ひとしく恐怖と欠乏から免かれ、[HOLE]のうちに生存する権利を有することを確認する。", correctAnswer: "平和" },

            // 第一章 天皇
            { title: "日本国憲法 第1条", text: "天皇は、日本国の象徴であり日本国民統合の象徴であつて、この地位は、主権の存する[HOLE]の総意に基く。", correctAnswer: "日本国民" },
            { title: "日本国憲法 第3条", text: "天皇の国事に関するすべての行為には、[HOLE]の助言と承認を必要とし、内閣が、その責任を負ふ。", correctAnswer: "内閣" },
            { title: "日本国憲法 第4条 第1項", text: "天皇は、この憲法の定める国事に関する行為のみを行ひ、[HOLE]に関する権能を有しない。", correctAnswer: "国政" },

            // 第二章 戦争の放棄
            { title: "日本国憲法 第9条 第1項", text: "日本国民は、正義と秩序を基調とする[HOLE]を誠実に希求し、国権の発動たる戦争と、武力による威嚇又は武力の行使は、国際紛争を解決する手段としては、永久にこれを放棄する。", correctAnswer: "国際平和" },
            { title: "日本国憲法 第9条 第2項", text: "前項の目的を達するため、陸海空軍その他の[HOLE]は、これを保持しない。国の交戦権は、これを認めない。", correctAnswer: "戦力" },

            // 第三章 国民の権利及び義務（人権・教育など）
            { title: "日本国憲法 第11条", text: "国民は、すべての基本的人権の享有を妨げられない。この憲法が国民に保障する基本的人権は、侵すことのできない[HOLE]の権利として、現在及び将来の国民に与へられる。", correctAnswer: "永久" },
            { title: "日本国憲法 第12条", text: "この憲法が国民に保障する自由及び権利は、国民の不断の努力によつて、これを保持しなければならない。又、国民は、これを濫用してはならないのであつて、常に[HOLE]のためにこれを利用する責任を負ふ。", correctAnswer: "公共の福祉" },
            { title: "日本国憲法 第13条", text: "すべて国民は、[HOLE]として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。", correctAnswer: "個人" },
            { title: "日本国憲法 第14条 第1項", text: "すべて国民は、[HOLE]の下に平等であつて、人種、信条、性別、社会的身分又は門地により、政治的、経済的又は社会的関係において、差別されない。", correctAnswer: "法" },
            { title: "日本国憲法 第15条 第2項", text: "すべて公務員は、[HOLE]の奉仕者であつて、一部の奉仕者ではない。", correctAnswer: "全体" },
            { title: "日本国憲法 第19条", text: "思想及び[HOLE]の自由は、これを侵してはならない。", correctAnswer: "良心" },
            { title: "日本国憲法 第20条 第1項", text: "[HOLE]の自由は、何人に対してもこれを保障する。いかなる宗教団体も、国から特権を受け、又は政治上の権力を行使してはならない。", correctAnswer: "信教" },
            { title: "日本国憲法 第20条 第3項", text: "国及びその機関は、[HOLE]その他いかなる宗教的活動もしてはならない。", correctAnswer: "宗教教育" },
            { title: "日本国憲法 第21条 第1項", text: "集会、結社及び言論、出版その他一切の[HOLE]の自由は、これを保障する。", correctAnswer: "表現" },
            { title: "日本国憲法 第21条 第2項", text: "[HOLE]は、これをしてはならない。通信の秘密は、これを侵してはならない。", correctAnswer: "検閲" },
            { title: "日本国憲法 第22条 第1項", text: "何人も、公共の福祉に反しない限り、居住、移転及び[HOLE]の自由を有する。", correctAnswer: "職業選択" },
            { title: "日本国憲法 第23条", text: "[HOLE]の自由は、これを保障する。", correctAnswer: "学問" },
            { title: "日本国憲法 第24条 第1項", text: "婚姻は、[HOLE]の合意のみに基いて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。", correctAnswer: "両性" },
            { title: "日本国憲法 第25条 第1項", text: "すべて国民は、[HOLE]で文化的な最低限度の生活を営む権利を有する。", correctAnswer: "健康" },
            { title: "日本国憲法 第25条 第2項", text: "国は、すべての生活部面について、[HOLE]、社会保障及び公衆衛生の向上及び増進に努めなければならない。", correctAnswer: "社会福祉" },
            
            // 教員採用試験の最重要焦点：第26条
            { title: "日本国憲法 第26条 第1項", text: "すべて国民は、法律の定めるところにより、その[HOLE]に応じて、ひとしく教育を受ける権利を有する。", correctAnswer: "能力" },
            { title: "日本国憲法 第26条 第1項", text: "すべて国民は、法律の定めるところにより、その能力に応じて、[HOLE]教育を受ける権利を有する。", correctAnswer: "ひとしく" },
            { title: "日本国憲法 第26条 第2項", text: "すべて国民は、法律の定めるところにより、その保護する子女に[HOLE]教育を受けさせる義務を負ふ。", correctAnswer: "普通" },
            { title: "日本国憲法 第26条 第2項", text: "すべて国民は、法律の定めるところにより、その保護する[HOLE]に普通教育を受けさせる義務を負ふ。", correctAnswer: "子女" },
            { title: "日本国憲法 第26条 第2項", text: "[HOLE]教育は、これを無償とする。", correctAnswer: "義務" },
            { title: "日本国憲法 第26条 第2項", text: "義務教育は、これを[HOLE]とする。", correctAnswer: "無償" },

            { title: "日本国憲法 第27条 第1項", text: "すべて国民は、[HOLE]の権利を有し、義務を負ふ。", correctAnswer: "勤労" },
            { title: "日本国憲法 第27条 第3項", text: "[HOLE]は、これを酷使してはならない。", correctAnswer: "児童" },
            { title: "日本国憲法 第28条", text: "勤労者の[HOLE]する権利及び団体交渉その他の団体行動をする権利は、これを保障する。", correctAnswer: "団結" },
            { title: "日本国憲法 第31条", text: "何人も、法律の定める[HOLE]によらなければ、その生命若しくは自由を奪はれ、又はその他の刑罰を科せられない。", correctAnswer: "手続" },

            // 第四章〜第六章 統治機構
            { title: "日本国憲法 第41条", text: "国会は、国権の[HOLE]であつて、国の唯一の立法機関である。", correctAnswer: "最高機関" },
            { title: "日本国憲法 第41条", text: "国会は、国権の最高機関であつて、国の唯一の[HOLE]機関である。", correctAnswer: "立法" },
            { title: "日本国憲法 第65条", text: "[HOLE]権は、内閣に属する。", correctAnswer: "行政" },
            { title: "日本国憲法 第66条 第2項", text: "内閣総理大臣その他の国務大臣は、[HOLE]でなければならない。", correctAnswer: "文民" },
            { title: "日本国憲法 第76条 第1項", text: "すべて[HOLE]権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。", correctAnswer: "司法" },
            { title: "日本国憲法 第76条 第3項", text: "すべて裁判官は、その[HOLE]に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。", correctAnswer: "良心" },

            // 第七章 財政（教採頻出：第89条）
            { title: "日本国憲法 第89条", text: "公金その他の公の財産は、宗教上の組織若しくは団体の使用、便益若しくは維持のため、又は[HOLE]に属しない慈善、教育若しくは博愛の事業に対し、これを支出し、又はその利用に供してはならない。", correctAnswer: "公の支配" },

            // 第九章・第十章 改正・最高法規
            { title: "日本国憲法 第96条 第1項", text: "この憲法の改正は、各議院の総議員の[HOLE]以上の賛成で、国会が、これを発議し、国民に提案してその承認を経なければならない。", correctAnswer: "三分の二", options: ["過半数", "三分の二", "四分の三", "五分の四"], forceSelect: true },
            { title: "日本国憲法 第96条 第1項", text: "…この承認には、特別の国民投票又は国会の定める選挙の際行はれる投票において、その[HOLE]の賛成を必要とする。", correctAnswer: "過半数", options: ["過半数", "三分の二", "三分の二以上", "四分の三"], forceSelect: true },
            { title: "日本国憲法 第98条 第1項", text: "この憲法は、国の[HOLE]であつて、その条規に反する法律、命令、詔勅及び国務に関するその他の行為の全部又は一部は、その効力を有しない。", correctAnswer: "最高法規" },
            { title: "日本国憲法 第99条", text: "天皇又は摂政及び国務大臣、国会議員、裁判官その他の公務員は、この憲法を[HOLE]し擁護する義務を負ふ。", correctAnswer: "尊重" },
            { title: "日本国憲法 第99条", text: "天皇又は摂政及び国務大臣、国会議員、裁判官その他の公務員は、この憲法を尊重し[HOLE]する義務を負ふ。", correctAnswer: "擁護" }
        ];

        // --- 設定値 ---
        const TIME_PER_QUESTION = 15; // 1問あたりの秒数

        // --- グローバル変数 ---
        let testMode = 'descriptive'; 
        let parsedQuestions = [];     
        let userAnswers = [];         
        let currentQuestionIndex = 0; 
        let timerInterval = null;     
        let totalTimeLimit = 0;
        let timeLeft = 0;             

        // フォントサイズ切り替え用の設定
        const fontSizes = ['normal', 'small', 'xsmall', 'large'];
        let currentFontSizeIndex = 0; 

        // --- DOM要素 ---
        const screens = {
            start: document.getElementById('start-screen'),
            test: document.getElementById('test-screen'),
            result: document.getElementById('result-screen')
        };
        const els = {
            qCountSelect: document.getElementById('question-count-select'),
            displayScore: document.getElementById('display-score'),
            displayTestTime: document.getElementById('display-test-time'),
            
            menuBtn: document.getElementById('menu-btn'),
            fontSizeBtn: document.getElementById('font-size-btn'),
            timerContainer: document.querySelector('.timer-container'),
            timerText: document.getElementById('timer-text'),
            drawerOverlay: document.getElementById('drawer-overlay'),
            drawerMenu: document.getElementById('drawer-menu'),
            drawerList: document.getElementById('drawer-list'),
            closeMenuBtn: document.getElementById('close-menu-btn'),
            
            desktopSidebar: document.getElementById('desktop-sidebar'),
            qNumberTitle: document.getElementById('question-number-title'),
            qBody: document.getElementById('question-body'),
            inputArea: document.getElementById('input-area'),
            inputInstruction: document.getElementById('input-instruction'),
            qProgress: document.getElementById('question-progress'),
            
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            submitConfirmBtn: document.getElementById('submit-confirm-btn'),
            
            submitModal: document.getElementById('submit-modal'),
            modalCancelBtn: document.getElementById('modal-cancel-btn'),
            modalSubmitBtn: document.getElementById('modal-submit-btn'),
            
            scoreDisplay: document.getElementById('score-display'),
            timeTaken: document.getElementById('time-taken'),
            resultDetails: document.getElementById('result-details')
        };

        // --- 初期化 ---
        function initApp() {
            // 出題数選択肢の動的調整（データ件数を反映）
            const allOpt = els.qCountSelect.querySelector('option[value="all"]');
            if (allOpt) {
                allOpt.textContent = `全問（${baseQuestions.length}問）`;
            }

            els.qCountSelect.addEventListener('change', updateStartScreen);
            updateStartScreen();

            document.getElementById('start-btn').addEventListener('click', startTest);
            
            els.prevBtn.addEventListener('click', () => navigateQuestion(-1));
            els.nextBtn.addEventListener('click', () => navigateQuestion(1));
            
            els.submitConfirmBtn.addEventListener('click', () => {
                els.submitModal.classList.remove('hidden');
            });
            els.modalCancelBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
            });
            els.modalSubmitBtn.addEventListener('click', () => {
                els.submitModal.classList.add('hidden');
                finishTest();
            });
            
            els.menuBtn.addEventListener('click', openDrawer);
            els.closeMenuBtn.addEventListener('click', closeDrawer);
            els.drawerOverlay.addEventListener('click', closeDrawer);

            els.fontSizeBtn.addEventListener('click', () => {
                currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
                const scaleMap = {
                    'normal': 1,
                    'small': 0.85,
                    'xsmall': 0.7,
                    'large': 1.15
                };
                document.documentElement.style.setProperty('--font-scale', scaleMap[fontSizes[currentFontSizeIndex]]);
            });
        }

        // --- スタート画面更新 ---
        function updateStartScreen() {
            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);
            
            els.displayScore.textContent = `${count}点`;
            
            totalTimeLimit = count * TIME_PER_QUESTION;
            const minutes = Math.floor(totalTimeLimit / 60);
            const seconds = totalTimeLimit % 60;
            els.displayTestTime.textContent = `${minutes}分${seconds > 0 ? seconds + '秒' : ''}`;
        }

        // --- テスト開始 ---
        function startTest() {
            const modeRadios = document.getElementsByName('test-mode');
            for (const radio of modeRadios) {
                if (radio.checked) testMode = radio.value;
            }

            generateQuestions();

            if (parsedQuestions.length === 0) {
                alert("出題可能な問題がありません。");
                return;
            }

            screens.start.classList.add('hidden');
            screens.test.classList.remove('hidden');
            screens.test.classList.add('flex');

            currentQuestionIndex = 0;
            renderQuestion(currentQuestionIndex);
            updateNavigations();
            
            startTimer();
        }

        // --- 問題生成 ---
        function generateQuestions() {
            parsedQuestions = [];
            userAnswers = [];

            const allAnswersArray = Array.from(new Set(baseQuestions.map(q => q.correctAnswer)));

            const val = els.qCountSelect.value;
            const count = val === 'all' ? baseQuestions.length : parseInt(val, 10);

            const shuffledData = [...baseQuestions].sort(() => Math.random() - 0.5);
            const selectedData = shuffledData.slice(0, count);

            selectedData.forEach((q) => {
                let options = [];
                if (q.options) {
                    options = [...q.options];
                } else {
                    options = [q.correctAnswer];
                    const dummyOptions = allAnswersArray.filter(a => a !== q.correctAnswer).sort(() => Math.random() - 0.5);
                    options = options.concat(dummyOptions.slice(0, 3)); 
                    options.sort(() => Math.random() - 0.5); 
                }

                parsedQuestions.push({
                    title: q.title,
                    text: q.text,
                    correctAnswer: q.correctAnswer,
                    options: options,
                    forceSelect: q.forceSelect || false
                });
                
                userAnswers.push(""); 
            });
        }

        // --- 画面描画 ---
        function renderQuestion(index) {
            const q = parsedQuestions[index];
            
            els.qNumberTitle.innerHTML = `【問題 ${index + 1}】<span class="text-sm ml-2 font-normal text-gray-700">（1点）- ${q.title}</span>`;
            const displayText = q.text.replace('[HOLE]', `<span class="font-bold px-1 text-blue-900">（　　　）</span>`).replace(/\n/g, '<br>');
            els.qBody.innerHTML = displayText;
            els.qProgress.textContent = `${index + 1} / ${parsedQuestions.length}`;

            els.inputArea.innerHTML = '';
            
            if (testMode === 'descriptive' && !q.forceSelect) {
                els.inputInstruction.textContent = "（　　　）に入る言葉を記述してください：";
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input fs-base';
                input.placeholder = "ここに入力";
                input.value = userAnswers[index];
                
                input.addEventListener('input', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(input);
            } else {
                els.inputInstruction.textContent = "（　　　）に入る言葉を選択してください：";
                const select = document.createElement('select');
                select.className = 'blank-select fs-base';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.textContent = "選択してください";
                select.appendChild(defaultOption);

                q.options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (userAnswers[index] === opt) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    userAnswers[index] = e.target.value;
                    updateNavigations();
                });
                els.inputArea.appendChild(select);
            }

            els.prevBtn.disabled = index === 0;
            if (index === parsedQuestions.length - 1) {
                els.nextBtn.classList.add('hidden');
                els.submitConfirmBtn.classList.remove('hidden');
            } else {
                els.nextBtn.classList.remove('hidden');
                els.submitConfirmBtn.classList.add('hidden');
            }
        }

        function navigateQuestion(step) {
            const newIndex = currentQuestionIndex + step;
            if (newIndex >= 0 && newIndex < parsedQuestions.length) {
                currentQuestionIndex = newIndex;
                renderQuestion(currentQuestionIndex);
                updateNavigations(); 
            }
        }

        function updateNavigations() {
            updateSidebarList();
            updateDrawerList();
        }

        function updateSidebarList() {
            els.desktopSidebar.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const button = document.createElement('button');
                const isActive = idx === currentQuestionIndex;
                const isAnswered = userAnswers[idx].trim() !== "";
                
                let baseClass = "text-center px-4 py-2.5 rounded font-medium transition border shadow-sm fs-base ";
                if (isActive) {
                    baseClass += "bg-[#bfdbfe] text-black border-[#93c5fd] font-bold"; 
                } else if (isAnswered) {
                    baseClass += "bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200";
                } else {
                    baseClass += "bg-[#e2e8f0] text-gray-700 border-[#cbd5e1] hover:bg-[#cbd5e1]";
                }
                
                button.className = baseClass;
                button.innerHTML = `【問題${idx + 1}】`;
                
                button.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    updateNavigations();
                });
                
                els.desktopSidebar.appendChild(button);
            });
        }

        function updateDrawerList() {
            els.drawerList.innerHTML = '';
            parsedQuestions.forEach((q, idx) => {
                const li = document.createElement('li');
                const isActive = idx === currentQuestionIndex;
                const isAnswered = userAnswers[idx].trim() !== "";
                
                let bgClass = isActive 
                    ? 'bg-[#bfdbfe] font-bold text-black border border-[#93c5fd]' 
                    : isAnswered 
                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                        : 'bg-[#e2e8f0] border border-[#cbd5e1] text-gray-700 hover:bg-[#cbd5e1]';

                li.className = `p-3 mb-1 rounded cursor-pointer transition fs-base ${bgClass}`;
                li.innerHTML = `<div class="text-center">【問題${idx + 1}】</div>`;
                
                li.addEventListener('click', () => {
                    currentQuestionIndex = idx;
                    renderQuestion(currentQuestionIndex);
                    closeDrawer(); 
                    updateNavigations();
                });
                
                els.drawerList.appendChild(li);
            });
        }

        function openDrawer() {
            els.drawerMenu.classList.remove('-translate-x-full');
            els.drawerOverlay.classList.remove('hidden');
        }

        function closeDrawer() {
            els.drawerMenu.classList.add('-translate-x-full');
            els.drawerOverlay.classList.add('hidden');
        }

        // --- タイマー ---
        function startTimer() {
            timeLeft = totalTimeLimit; 
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 10) {
                    els.timerContainer.classList.add('text-red-600');
                    els.timerContainer.classList.remove('text-gray-800');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    els.submitModal.classList.add('hidden');
                    alert("制限時間終了です！自動的に採点します。");
                    finishTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
            const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
            els.timerText.textContent = `${m}:${s}`;
        }

        function normalizeString(str) {
            if (!str) return "";
            return str.replace(/[\s　]/g, '').toLowerCase();
        }

        // --- 採点・結果表示 ---
        function finishTest() {
            clearInterval(timerInterval);
            
            let correctCount = 0;
            els.resultDetails.innerHTML = '';

            parsedQuestions.forEach((q, idx) => {
                const userAnswer = userAnswers[idx];
                const isCorrect = normalizeString(userAnswer) === normalizeString(q.correctAnswer);
                if (isCorrect) correctCount++;

                const resultCard = document.createElement('div');
                resultCard.className = `p-4 rounded-lg border-l-4 ${isCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`;
                
                const icon = isCorrect 
                    ? `<span class="text-green-600 font-bold fs-xl">○ 正解</span>` 
                    : `<span class="text-red-600 font-bold fs-xl">× 不正解</span>`;

                const correctHtmlText = q.text.replace('[HOLE]', `<span class="font-bold border-b-2 border-blue-600 px-1 text-blue-900">（ ${q.correctAnswer} ）</span>`).replace(/\n/g, '<br>');

                const displayUserAnswer = userAnswer.trim() === "" ? "（未解答）" : userAnswer;

                resultCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-gray-800 fs-base">問題 ${idx + 1}: <span class="font-normal text-gray-600 fs-sm">${q.title}</span></h4>
                        ${icon}
                    </div>
                    <div class="text-gray-700 bg-white p-3 rounded border border-gray-200 mb-2 fs-lg">
                        ${correctHtmlText}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2 fs-sm">
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">あなたの解答</span>
                            <span class="font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${displayUserAnswer}</span>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="text-gray-500 block fs-sm">正解</span>
                            <span class="font-bold text-blue-700">${q.correctAnswer}</span>
                        </div>
                    </div>
                `;
                els.resultDetails.appendChild(resultCard);
            });

            els.scoreDisplay.textContent = `${correctCount}点 / ${parsedQuestions.length}点`;
            
            const timeTakenSec = totalTimeLimit - Math.max(0, timeLeft);
            const tm = Math.floor(timeTakenSec / 60);
            const ts = timeTakenSec % 60;
            els.timeTaken.textContent = `所要時間: ${tm}分 ${ts}秒`;

            screens.test.classList.add('hidden');
            screens.test.classList.remove('flex');
            screens.result.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
